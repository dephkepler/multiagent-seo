openapi: 3.0.3
info:
  title: Contentflow API
  version: 0.1.0
  description: SEO content pipeline — generates articles and pushes drafts to WordPress.
servers:
  - url: https://multiagent-seo.8cell.tech
    description: Staging (live deployment — Try it out hits this)
  - url: http://localhost:8080
    description: Local dev

tags:
  - name: Articles
    description: Generate, list, and publish SEO articles.

paths:
  /generate:
    post:
      tags: [Articles]
      summary: Generate an article (synchronous)
      description: |
        Runs the full 5-step pipeline and returns the finished article:

        1. **SERP** — fetch top competitors via DataForSEO for the keyword.
        2. **Brief** — LLM call: build an SEO brief from competitors + target keywords.
        3. **Writer** — LLM call: draft the full article from the brief.
        4. **Editor** — LLM call: polish for SEO and readability.
        5. **Originality check + humanize loop** — runs AI detection; if AI score
           ≥ `ai_threshold`, rewrites the article and re-checks, up to `max_cycles` times.

        Then a WordPress draft is created and the row is saved in Postgres.

        **Latency:** 30–90s per request depending on length and humanize cycles.
        **Cost:** every request burns LLM tokens — use `max_tokens` and small
        `min_words/max_words` for cheap tests.
      operationId: generate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
            examples:
              real_prod_request:
                summary: Real prod-like payload (matches what we actually run)
                description: |
                  This is the same body the team uses from Kreya — every knob
                  set explicitly so you see what the pipeline actually receives.
                value:
                  keyword: "crown play casino"
                  provider: "claude"
                  model: "claude-sonnet-4-6"
                  min_words: 200
                  max_words: 500
                  max_tokens: 400
                  max_cycles: 1
                  ai_threshold: 0.5
                  language: "en"
                  auto_publish: false
              minimal:
                summary: Minimal request — keyword only, config defaults for the rest
                value: { keyword: "как выбрать ноутбук" }
              cheap_test:
                summary: Cheapest possible run (~$0.001) — for smoke-testing the pipeline
                description: |
                  Tiny article, hard token cap, only 1 humanize cycle, low threshold.
                  Use this when you just want to verify the wiring, not the output.
                value:
                  keyword: "test"
                  min_words: 50
                  max_words: 100
                  max_tokens: 400
                  max_cycles: 1
                  ai_threshold: 0.9
              override_provider:
                summary: Force Claude Haiku (cheaper than Sonnet)
                value:
                  keyword: "test"
                  provider: "claude"
                  model: "claude-haiku-4-5-20251001"
                  max_tokens: 500
              auto_publish:
                summary: Generate + publish to WordPress in one call
                description: |
                  Skip the manual `POST /articles/{id}/publish` step — the response
                  comes back already as `status: "published"` with a non-empty `wp_post_url`.
                value:
                  keyword: "high flyer casino"
                  provider: "claude"
                  model: "claude-sonnet-4-6"
                  max_words: 800
                  auto_publish: true
      responses:
        '200':
          description: Article generated and pushed as WP draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResult'
              examples:
                draft_created:
                  summary: Typical successful generation (draft created, not published)
                  value:
                    id: 42
                    keyword: "crown play casino"
                    status: "draft"
                    wp_post_id: 6018
                    wp_edit_url: "https://multiagent-seo-site.com/wp-admin/post.php?post=6018&action=edit"
                    wp_post_url: ""
                    content: "<h1>Crown Play Casino Review</h1><p>Crown Play is an online casino...</p>"
                    created_at: "2026-05-14T08:59:00Z"
                    updated_at: "2026-05-14T09:00:12Z"
                    provider: "claude"
                    model: "claude-sonnet-4-6"
                    target_keywords: ["crown play casino", "crown play login", "crown play ontario"]
                    suggested_title: "Crown Play Casino Review: Bonuses, Login & Ontario Guide"
                    humanized: false
                    duration_ms: 42100
                    check_result:
                      ai_score: 0.31
                      plagiarism_score: 0.04
                      original: true
                      provider: "huggingface model=Hello-SimpleAI/chatgpt-detector-roberta"
                    check_cycles:
                      - cycle: 1
                        threshold: 0.5
                        check_result:
                          ai_score: 0.31
                          plagiarism_score: 0.04
                          original: true
                          provider: "huggingface model=Hello-SimpleAI/chatgpt-detector-roberta"
                    token_usage:
                      steps:
                        - { step: "brief",  input_tokens: 820,  output_tokens: 312 }
                        - { step: "writer", input_tokens: 1140, output_tokens: 398 }
                        - { step: "editor", input_tokens: 1502, output_tokens: 401 }
                      total_input: 3462
                      total_output: 1111
        '400':
          description: |
            Validation error — one of:
            - `keyword is required` (missing/empty)
            - `keyword is too long` (>200 chars)
            - `min_words, max_words and max_tokens must be non-negative`
            - `min_words must be <= max_words`
          content:
            text/plain:
              schema: { type: string }
        '404':
          description: |
            No keyword cluster found in Sheets for this topic. Generation is
            aborted before any LLM call so tokens aren't wasted on typos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "no_cluster"
                message: "no keyword cluster found for this topic in Sheets — add rows first"
                keyword: "несуществующая тема"
        '500':
          description: Pipeline failed (LLM / WP / DB / Sheets error). Client sees generic "internal error"; details go to server logs.
          content:
            text/plain:
              schema: { type: string }
              example: "internal error"

  /articles:
    get:
      tags: [Articles]
      summary: List all articles
      description: Returns articles in reverse chronological order.
      operationId: listArticles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
              examples:
                two_articles:
                  summary: Two rows — one draft, one already published
                  value:
                    - ID: 42
                      Keyword: "crown play casino"
                      Status: "draft"
                      WPPostID: 6018
                      WPEditURL: "https://multiagent-seo-site.com/wp-admin/post.php?post=6018&action=edit"
                      WPPostURL: ""
                      CreatedAt: "2026-05-14T08:59:00Z"
                      UpdatedAt: "2026-05-14T09:00:12Z"
                    - ID: 41
                      Keyword: "high flyer casino"
                      Status: "published"
                      WPPostID: 6017
                      WPEditURL: "https://multiagent-seo-site.com/wp-admin/post.php?post=6017&action=edit"
                      WPPostURL: "https://multiagent-seo-site.com/high-flyer-casino-review/"
                      CreatedAt: "2026-05-13T17:22:01Z"
                      UpdatedAt: "2026-05-13T17:24:48Z"
        '500':
          description: Internal error

  /articles/{id}/publish:
    post:
      tags: [Articles]
      summary: Publish a draft article to WordPress
      description: |
        Flips a `draft` article to `published`: calls the WordPress REST API to
        change its status, stores the resulting public URL, and returns the
        updated row.
      operationId: publishArticle
      parameters:
        - name: id
          in: path
          required: true
          description: Internal article id from `POST /generate` or `GET /articles`.
          schema: { type: integer, format: int64 }
          example: 10
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResult'
              examples:
                published:
                  summary: Draft flipped to published — has a public URL now
                  value:
                    id: 42
                    status: "published"
                    wp_post_id: 6018
                    wp_edit_url: "https://multiagent-seo-site.com/wp-admin/post.php?post=6018&action=edit"
                    wp_post_url: "https://multiagent-seo-site.com/crown-play-casino-review/"
                    updated_at: "2026-05-14T09:05:33Z"
        '400':
          description: |
            Either `id` is not a positive integer, or the article has no
            WordPress draft yet (generation never reached CreateDraft).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "no_draft"
                message: "article has no WordPress draft yet (generation likely failed)"
        '404':
          description: No article with this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "not_found"
                message: "article with this id does not exist"
        '409':
          description: Already published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "already_published"
                message: "article is already published"
        '500':
          description: WordPress or DB failure. See server logs.

components:
  schemas:
    GenerateRequest:
      type: object
      required: [keyword]
      properties:
        keyword:
          type: string
          maxLength: 200
          example: "как выбрать ноутбук"
        min_words:
          type: integer
          minimum: 0
          description: |
            Prompt-level minimum article length (instructs the model).
            `0` / omitted → fall back to `article.minWords` from settings.yaml.
          example: 50
        max_words:
          type: integer
          minimum: 0
          description: |
            Prompt-level maximum article length. Must be ≥ `min_words` when both
            are non-zero. `0` / omitted → fall back to `article.maxWords`.
          example: 100
        max_tokens:
          type: integer
          minimum: 0
          description: |
            Hard API cap on output tokens per LLM call (applies to all 3 stages).
            Useful for cheap tests: e.g. `400` keeps a request well under a cent.
            `0` / omitted → derived as `max_words*3 + 200`, or provider default
            if `max_words` is also 0.
          example: 400
        language:
          type: string
          description: Override for `article.language` (e.g. `ru`, `en`, `uk`).
          example: "en"
        site_topic:
          type: string
          description: Override for `article.siteTopic` (niche context the brief will use).
          example: "personal finance"
        extra_rules:
          type: string
          description: Override for `article.extraRules` (additional instructions to all 3 stages).
          example: "never mention competitors"
        provider:
          type: string
          enum: [groq, claude, anthropic]
          description: |
            Switch LLM provider for this request. `""` / omitted → config default.
            Requires the matching API key in config (`CF_LLM_GROQ_API_KEY` or
            `CF_LLM_CLAUDE_API_KEY`).
          example: "claude"
        model:
          type: string
          description: |
            Override model name for the selected provider. `""` / omitted →
            config default.
          example: "claude-haiku-4-5-20251001"
        auto_publish:
          type: boolean
          default: false
          description: |
            When `true`, publishes the WP draft to the site immediately after
            generation. The response then has `status: "published"` and a
            non-empty `wp_post_url`. If publishing fails, the article stays
            as a draft and the failure is reported in `auto_publish_error`.
          example: false
        max_cycles:
          type: integer
          minimum: 0
          description: |
            Max number of humanize rewrite cycles when the originality check
            fails. `0` / omitted → falls back to `checker.maxCycles` from
            settings (default 3). Set to `1` in tests to keep runs short.
          example: 1
        ai_threshold:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: |
            AI-detection threshold (0.0–1.0). The article passes when
            `ai_score < ai_threshold`. `0` / omitted → falls back to
            `checker.aiThreshold` from settings (default 0.8).
            Lower = stricter (rewrites more aggressively).
          example: 0.5

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: "Stable machine-readable code (e.g. `no_cluster`)."
          example: "no_cluster"
        message:
          type: string
          description: "Human-readable detail."
        keyword:
          type: string
          description: "Echoed back when the error relates to a specific topic."

    GenerateResult:
      type: object
      properties:
        id:          { type: integer, format: int64, example: 1 }
        keyword:     { type: string, example: "high flyer casino" }
        status:
          type: string
          enum: [draft, published]
          description: |
            `draft` after a normal run. `published` only when the request set
            `auto_publish: true` and publishing succeeded.
          example: draft
        wp_post_id:  { type: integer, format: int64, example: 42 }
        wp_edit_url: { type: string, example: "https://site.com/wp-admin/post.php?post=42&action=edit" }
        wp_post_url:
          type: string
          description: |
            Public article URL. Empty unless the article is `published`
            (either via `auto_publish` or a later `POST /articles/{id}/publish`).
          example: ""
        content:     { type: string, description: "Final edited article body (markdown/HTML)." }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }
        auto_publish_error:
          type: string
          description: |
            Set only when `auto_publish: true` was requested and publishing
            failed after the draft was created. The article remains a draft;
            retry with `POST /articles/{id}/publish`.
          example: ""
        target_keywords:
          type: array
          items: { type: string }
          description: |
            Debug: keywords pulled from Sheets for this topic. Empty array means
            the topic had no cluster (or the Sheets lookup failed; check logs).
          example: ["high flyer casino", "high flyer casino ontario"]
        suggested_title:
          type: string
          description: |
            Debug: suggested article title from the Sheets `title` column (if any).
            The LLM is told to adjust only if clearly better.
          example: "High Flyer Casino Review: Bonuses, Login & Ontario Guide"
        provider:
          type: string
          description: LLM provider actually used (echoes the request or config default).
          example: "claude"
        model:
          type: string
          description: LLM model actually used.
          example: "claude-sonnet-4-6"
        humanized:
          type: boolean
          description: |
            `true` if the article was rewritten at least once after failing the
            originality check. Always paired with `check_cycles.length > 1`.
          example: false
        duration_ms:
          type: integer
          format: int64
          description: Total wall-clock time of the pipeline in milliseconds.
          example: 42100
        competitor_data:
          type: object
          description: |
            Raw SERP results from DataForSEO (top organic results for the keyword).
            Shape mirrors the DataForSEO response — useful for debugging which
            competitors the brief was built from.
        check_result:
          $ref: '#/components/schemas/CheckResult'
        check_cycles:
          type: array
          description: |
            Every check + rewrite iteration in order. `cycle: 1` is the first
            check, `cycle: 2` is after the first humanize, etc. Length > 1 only
            when the first check failed and a rewrite happened.
          items:
            $ref: '#/components/schemas/CheckCycle'
        token_usage:
          $ref: '#/components/schemas/TokenUsage'

    Article:
      type: object
      properties:
        ID:        { type: integer, format: int64, example: 1 }
        Keyword:   { type: string, example: "high flyer casino" }
        Status:
          type: string
          enum: [generating, draft, published, failed]
          example: draft
        WPPostID:  { type: integer, format: int64, example: 42 }
        WPEditURL: { type: string, example: "https://site.com/wp-admin/post.php?post=42&action=edit" }
        WPPostURL: { type: string, example: "" }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }

    PublishResult:
      type: object
      properties:
        id:          { type: integer, format: int64, example: 10 }
        status:
          type: string
          enum: [published]
          example: published
        wp_post_id:  { type: integer, format: int64, example: 6018 }
        wp_edit_url: { type: string, example: "https://site.com/wp-admin/post.php?post=6018&action=edit" }
        wp_post_url: { type: string, example: "https://site.com/online-casino-australia/" }
        updated_at:  { type: string, format: date-time }

    CheckResult:
      type: object
      description: Outcome of one originality check (AI detection + plagiarism).
      properties:
        ai_score:
          type: number
          format: float
          description: Fraction of text classified as AI-generated (0.0–1.0). Lower is better.
          example: 0.31
        plagiarism_score:
          type: number
          format: float
          description: Fraction of text matched against existing sources (0.0–1.0).
          example: 0.04
        original:
          type: boolean
          description: "`true` when `ai_score < ai_threshold` (passes the gate)."
          example: true
        provider:
          type: string
          description: Which checker service produced this result.
          example: "huggingface model=Hello-SimpleAI/chatgpt-detector-roberta"
        issues:
          type: array
          items: { type: string }
          description: Human-readable reasons the article was flagged. Empty when passing.
        sentences_flagged:
          type: array
          items: { type: string }
          description: Specific sentences detected as AI-written. Fed back into the humanize prompt.
        report_url:
          type: string
          description: Link to full report on the provider's site (if available).

    CheckCycle:
      type: object
      description: One check + (optional) rewrite iteration.
      properties:
        cycle:
          type: integer
          description: 1-based iteration index.
          example: 1
        threshold:
          type: number
          format: float
          description: "`ai_threshold` applied this cycle."
          example: 0.5
        check_result:
          $ref: '#/components/schemas/CheckResult'

    TokenUsage:
      type: object
      description: Per-step LLM token consumption. `total_*` = sum of all `steps`.
      properties:
        steps:
          type: array
          items:
            type: object
            properties:
              step:
                type: string
                description: Pipeline step that made the LLM call (`brief`, `writer`, `editor`, `humanize_1`, ...).
                example: "brief"
              input_tokens:  { type: integer, example: 820 }
              output_tokens: { type: integer, example: 312 }
        total_input:  { type: integer, example: 3462 }
        total_output: { type: integer, example: 1111 }
