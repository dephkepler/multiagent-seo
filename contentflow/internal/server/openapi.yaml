openapi: 3.0.3
info:
  title: Contentflow API
  version: 0.1.0
  description: |
    # Contentflow — генератор SEO-статей

    Сервис по ключевому слову собирает данные о конкурентах из Google,
    пишет статью через LLM (Claude / Groq), прогоняет её через AI-детектор,
    при необходимости переписывает «живее», создаёт черновик в WordPress
    и сохраняет запись в базе. На выходе вы получаете либо готовый
    черновик в админке WP, либо опубликованную статью на сайте.

    ## Как это работает (асинхронно)

    Генерация занимает от 30 секунд до 5 минут и больше, поэтому
    `POST /generate` **не ждёт** окончания. Он сразу (за 1–2 секунды) возвращает
    `202 Accepted` с `id` статьи и `status: "generating"`. Пайплайн крутится в фоне.

    Клиент дальше **поллит** `GET /articles/{id}` (например раз в 5 секунд),
    пока `status` не сменится на:

    - **`draft`** — статья сгенерирована, черновик создан в WordPress (`wp_edit_url` заполнен).
    - **`published`** — статья сразу опубликована на сайт (если был передан `auto_publish: true`).
    - **`failed`** — что-то пошло не так (LLM упал, WP недоступен и т.д.). Смотри логи сервера.

    Если запросишь `GET /articles/{id}` до того как статья дописана —
    увидишь `status: "generating"` и пустые поля `wp_post_id`/`wp_edit_url`.
    Это нормально, просто продолжай поллить.

    ---

    ## С чего начать (для тестирования)

    1. Раскройте блок **POST /generate** ниже.
    2. Нажмите кнопку **Try it out** справа.
    3. В выпадающем списке **Examples** выберите `real_prod_request` —
       это рабочий payload, который мы используем в проде. Можно ничего
       не менять, просто нажать **Execute**.
    4. **Сразу** (за ~1 секунду) получите ответ `202` с `id`. Запомни этот id.
       Заодно в ответе уже видно, какие ключи и H1 подтянулись из таблицы —
       можно сверить, что взялись правильные.
    5. Перейди в блок **GET /articles/{id}** ниже, вставь `id` в поле,
       и жми **Execute** каждые 5–10 секунд, пока `status` не изменится
       с `generating` на `draft` (или `failed`).
    6. В ответе `draft` будет ссылка `wp_edit_url` — это черновик в админке
       WordPress, можно открыть в новой вкладке и посмотреть результат.
       Чтобы опубликовать — используй `POST /articles/{id}/publish`.

    ## Самый простой запрос

    Минимум, который вообще нужен — это ключевое слово.
    Всё остальное возьмётся из конфига сервера.

    ```json
    {
      "keyword": "crown play casino"
    }
    ```

    ## Полный «прод-like» запрос с пояснением каждого поля

    ```json
    {
      "keyword": "crown play casino",
      "site": "playpulse",
      "provider": "claude",
      "model": "claude-sonnet-4-6",
      "min_words": 200,
      "max_words": 500,
      "max_tokens": 400,
      "max_cycles": 1,
      "ai_threshold": 0.5,
      "language": "en",
      "auto_publish": false,
      "include_images": true
    }
    ```

    > **Картинки в статье.** Управляются полем `include_images`:
    > - `true` — расставить картинки из Pexels (требует `CF_PEXELS_API_KEY` на сервере).
    > - `false` — выключить картинки, плейсхолдеры `[IMG | ...]` будут вырезаны.
    > - не передавать — серверный дефолт: включено, если Pexels настроен.
    >
    > LLM в любом случае расставляет в тексте `[IMG | описание | ALT: текст]`;
    > на этапе публикации они либо превращаются в `<figure><img></figure>`
    > с фото из Pexels + подпись автора (TOS), либо вырезаются.
    > Логи покажут состояние сервера: `pexels configured` vs `pexels disabled`.

    | Поле           | Что это                                                                   | Как выбирать значение                                                                                |
    |----------------|---------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------|
    | `keyword`      | Тема статьи / основное ключевое слово.                                    | Берётся из Google Sheets с кластерами. Пример: `crown play casino`, `как выбрать ноутбук`.           |
    | `site`         | На какой WordPress-сайт публиковать черновик.                             | Алиас из секции `wordpress:` в конфиге. Доступны `default` и `playpulse`. Пусто = `default`.         |
    | `provider`     | Какой LLM-провайдер использовать.                                         | `claude` — качественнее, дороже. `groq` — быстрее и дешевле, качество ниже. По умолчанию = из конфига. |
    | `model`        | Конкретная модель внутри провайдера.                                      | Для `claude`: `claude-sonnet-4-6` (баланс), `claude-haiku-4-5-20251001` (дёшево). Для `groq`: `llama-3.3-70b-versatile`. |
    | `min_words`    | Минимальная длина статьи в словах (передаётся в промпт модели).           | Для теста — 200–500. Для прода — 1500–2000.                                                          |
    | `max_words`    | Максимальная длина статьи в словах.                                       | Должна быть ≥ `min_words`. Для теста — 500–800. Для прода — 3000.                                    |
    | `max_tokens`   | Жёсткий API-лимит на размер ответа LLM за один шаг.                       | 400 для теста (≈ \$0.001). 4000–6000 для прода. Если 0 — посчитается автоматически.                  |
    | `max_cycles`   | Сколько раз переписывать статью, если AI-детектор её зафлажил.            | 1 для теста (быстрее). 3 для прода.                                                                  |
    | `ai_threshold` | Порог «AI-ности», ниже которого статья считается достаточно «живой».      | 0.5 = строгий (часто переписывает). 0.8 = мягкий (почти всегда пропускает).                          |
    | `language`     | Язык статьи.                                                              | `ru`, `en`, `uk`.                                                                                    |
    | `auto_publish` | Сразу опубликовать на сайт или оставить черновиком в WP.                  | `false` для теста — посмотреть результат глазами и опубликовать вручную через `/articles/{id}/publish`. `true` — только когда уверены. |
    | `include_images` | Включить картинки из Pexels в статье.                                   | `true` — добавить картинки (нужен ключ Pexels на сервере). `false` — вырезать плейсхолдеры. Не передавать — серверный дефолт. |

    ## Как тестировать дёшево

    Если просто хотите убедиться, что пайплайн работает (не интересует
    качество статьи) — используйте пример `cheap_test`. Он ставит:
    - `min_words: 50`, `max_words: 100` — статья на 1 абзац
    - `max_tokens: 400` — жёсткий потолок
    - `max_cycles: 1` — без долгих циклов переписывания

    Такой запрос стоит около \$0.001 и проходит за ~15 секунд.

    ## Эндпоинты в двух словах

    - **POST /generate** — основной. Запускает весь пайплайн от ключа до WP-черновика. Долгий (30–90с), синхронный.
    - **GET /articles** — список всех сгенерированных статей в базе. Быстрый.
    - **POST /articles/{id}/publish** — опубликовать ранее созданный черновик в WP. Берёт `id` из ответа `/generate` или из `/articles`.

    ## Что делать, если что-то пошло не так

    - **404 `no_cluster`** — для этого ключа нет строки в Google Sheets с кластером. Добавьте строку в таблицу, и тогда генерация заработает.
    - **400 `keyword is required`** — забыли передать `keyword` в теле, или он пустой.
    - **500 `internal error`** — ошибка на стороне сервера (LLM-провайдер, WP, БД). Детали в логах сервера.
    - **Запрос завис на минуту+** — это нормально, генерация синхронная. Не отменяйте до 2 минут.
servers:
  - url: https://multiagent-seo.8cell.tech
    description: Staging (live deployment — Try it out hits this)
  - url: http://localhost:8080
    description: Local dev

tags:
  - name: Articles
    description: Generate, list, and publish SEO articles.

paths:
  /generate:
    post:
      tags: [Articles]
      summary: Поставить ключевое слово в очередь на генерацию (async, ответ за ~1 секунду)
      description: |
        ## Как пользоваться

        1. Нажмите **Try it out** (кнопка справа).
        2. В **Examples** выберите `real_prod_request` — там уже стоит готовый
           боевой payload. Можно ничего не менять.
        3. (Опционально) В теле запроса поменяйте `keyword` на свою тему.
           Тема должна быть в Google Sheets — иначе вернётся 404 `no_cluster`.
        4. Нажмите **Execute**. Ответ придёт **сразу**, со статусом `202`:
           - `id` — id новой статьи в БД;
           - `status` — `generating`;
           - `target_keywords` — все ключи из ячейки B (через запятую) для этой темы;
           - `suggested_title` — H1 из ячейки C;
           - `provider` / `model` — кто будет писать;
           - `status_url` — куда поллить (например `/articles/42`).
        5. Дальше идёте в блок **GET /articles/{id}**, вставляете id и поллите
           каждые 5–10 секунд, пока `status` не сменится на `draft` (готово)
           или `failed` (ошибка).

        ## Что происходит под капотом

        Синхронно (то, что делается ДО возврата 202):

        1. Lookup в Google Sheets — найти тему в колонке A, получить ключи и H1.
        2. Создать строку в Postgres со статусом `generating`.

        Асинхронно (фон, после возврата 202 — может занять 30 секунд — 5 минут):

        3. **SERP** — получаем топ-выдачу Google для ключа через DataForSEO.
        4. **Brief** — LLM пишет SEO-бриф, опираясь на конкурентов и кластер ключей.
        5. **Writer** — LLM пишет статью по брифу (`min_words`–`max_words`).
        6. **Editor** — LLM полирует SEO и читаемость.
        7. **Originality check** — прогон через AI-детектор. Если `ai_score ≥ ai_threshold`,
           статья переписывается «живее» и проверяется снова — до `max_cycles` раз.
        8. Черновик в WordPress, обновление строки в БД (`draft` или `failed`).

        Лимит на фоновую задачу — 15 минут.

        ## Сколько это стоит

        - **`cheap_test` (пример ниже)** — ~\$0.001 за запрос, ~15 секунд.
        - **`real_prod_request` (200–500 слов, claude-sonnet)** — ~\$0.02–0.05, ~30–60 секунд.
        - **Полноразмерный прод (1500+ слов, 3 цикла humanize)** — ~\$0.10–0.30, ~60–120 секунд.

        ## Подсказки

        - Если просто хотите проверить, что сервис жив — берите `cheap_test`.
        - Если хотите воспроизвести то, что делает команда в проде — берите `real_prod_request`.
        - `auto_publish: true` сразу публикует на сайт. **Не ставьте**, пока не посмотрели результат глазами.
      operationId: generate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
            examples:
              real_prod_request:
                summary: Real prod-like payload (matches what we actually run)
                description: |
                  This is the same body the team uses from Kreya — every knob
                  set explicitly so you see what the pipeline actually receives.
                value:
                  keyword: "crown play casino"
                  provider: "claude"
                  model: "claude-sonnet-4-6"
                  min_words: 200
                  max_words: 500
                  max_tokens: 400
                  max_cycles: 1
                  ai_threshold: 0.5
                  language: "en"
                  auto_publish: false
              minimal:
                summary: Minimal request — keyword only, config defaults for the rest
                value: { keyword: "как выбрать ноутбук" }
              cheap_test:
                summary: Cheapest possible run (~$0.001) — for smoke-testing the pipeline
                description: |
                  Tiny article, hard token cap, only 1 humanize cycle, low threshold.
                  `include_images: false` skips Pexels calls so the test doesn't burn quota.
                  Use this when you just want to verify the wiring, not the output.
                value:
                  keyword: "test"
                  min_words: 50
                  max_words: 100
                  max_tokens: 400
                  max_cycles: 1
                  ai_threshold: 0.9
                  include_images: false
              override_provider:
                summary: Force Claude Haiku (cheaper than Sonnet)
                value:
                  keyword: "test"
                  provider: "claude"
                  model: "claude-haiku-4-5-20251001"
                  max_tokens: 500
              auto_publish:
                summary: Generate + publish to WordPress in one call
                description: |
                  Skip the manual `POST /articles/{id}/publish` step — the response
                  comes back already as `status: "published"` with a non-empty `wp_post_url`.
                value:
                  keyword: "high flyer casino"
                  provider: "claude"
                  model: "claude-sonnet-4-6"
                  max_words: 800
                  auto_publish: true
              playpulse_site:
                summary: Publish to the playpulse.tech site instead of the default
                description: |
                  Override the target WordPress site via the `site` field. The alias
                  must exist in `wordpress:` config — unknown aliases return 400
                  `unknown_site`.
                value:
                  keyword: "crown play casino"
                  site: "playpulse"
                  provider: "claude"
                  model: "claude-sonnet-4-6"
                  max_words: 800
      responses:
        '202':
          description: |
            Запрос принят, статья поставлена в очередь и генерируется в фоне.
            Поллите `GET /articles/{id}` чтобы узнать когда закончится.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateAccepted'
              examples:
                queued:
                  summary: Запрос принят, генерация началась
                  value:
                    id: 42
                    keyword: "Android Game Development Services"
                    status: "generating"
                    created_at: "2026-05-14T08:59:00Z"
                    target_keywords:
                      - "Android Game Development"
                      - "Android Game Development Services"
                      - "Android Game Development Company"
                      - "Android Game App Development"
                      - "Android Game Development Studio"
                    suggested_title: "Android Game Development Services"
                    provider: "claude"
                    model: "claude-sonnet-4-6"
                    status_url: "/articles/42"
        '400':
          description: |
            Validation error — one of:
            - `keyword is required` (missing/empty)
            - `keyword is too long` (>200 chars)
            - `min_words, max_words and max_tokens must be non-negative`
            - `min_words must be <= max_words`
            - `unknown_site` — `site` does not match any alias in `wordpress:` config
          content:
            text/plain:
              schema: { type: string }
        '404':
          description: |
            No keyword cluster found in Sheets for this topic. Generation is
            aborted before any LLM call so tokens aren't wasted on typos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "no_cluster"
                message: "no keyword cluster found for this topic in Sheets — add rows first"
                keyword: "несуществующая тема"
        '500':
          description: Pipeline failed (LLM / WP / DB / Sheets error). Client sees generic "internal error"; details go to server logs.
          content:
            text/plain:
              schema: { type: string }
              example: "internal error"

  /articles:
    get:
      tags: [Articles]
      summary: Список всех сгенерированных статей
      description: |
        Возвращает все записи из БД в обратном хронологическом порядке (свежие сверху).
        Пустой список = `[]`, не ошибка.

        ⚠️ **Если вы открыли `/articles` в браузере и видите «непонятный текст» —
        это нормально.** Это просто сырой JSON, формат для программ.
        Чтобы посмотреть статьи глазами:

        1. Откройте `wp_edit_url` из ответа — попадёте сразу на черновик в админке WordPress.
        2. Или нажмите **Try it out** → **Execute** ниже — Swagger покажет тот же JSON,
           но с подсветкой и форматированием.
      operationId: listArticles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
              examples:
                two_articles:
                  summary: Two rows — one draft, one already published
                  value:
                    - ID: 42
                      Keyword: "crown play casino"
                      Status: "draft"
                      WPPostID: 6018
                      WPEditURL: "https://multiagent-seo-site.com/wp-admin/post.php?post=6018&action=edit"
                      WPPostURL: ""
                      CreatedAt: "2026-05-14T08:59:00Z"
                      UpdatedAt: "2026-05-14T09:00:12Z"
                    - ID: 41
                      Keyword: "high flyer casino"
                      Status: "published"
                      WPPostID: 6017
                      WPEditURL: "https://multiagent-seo-site.com/wp-admin/post.php?post=6017&action=edit"
                      WPPostURL: "https://multiagent-seo-site.com/high-flyer-casino-review/"
                      CreatedAt: "2026-05-13T17:22:01Z"
                      UpdatedAt: "2026-05-13T17:24:48Z"
        '500':
          description: Internal error

  /articles/{id}:
    get:
      tags: [Articles]
      summary: Получить текущее состояние статьи (используется для поллинга)
      description: |
        Возвращает строку из БД для статьи с этим id. После `POST /generate`
        вызывайте этот эндпоинт каждые 5–10 секунд, пока `status` не сменится
        с `generating` на одно из терминальных значений:

        - **`draft`** — генерация прошла успешно, есть `wp_post_id` и `wp_edit_url`.
        - **`published`** — статья сразу же опубликована (при `auto_publish: true`).
        - **`failed`** — генерация упала. Подробности — в логах сервера.

        В JSON-ответе также есть `competitor_data` (топ-выдача из DataForSEO,
        с которой строился бриф) и `check_result` (результат AI-детектора).
      operationId: getArticle
      parameters:
        - name: id
          in: path
          required: true
          description: Внутренний id статьи из `POST /generate`.
          schema: { type: integer, format: int64 }
          example: 42
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleResult'
              examples:
                still_generating:
                  summary: Статья ещё пишется — продолжай поллить
                  value:
                    id: 42
                    keyword: "Android Game Development Services"
                    status: "generating"
                    wp_post_id: 0
                    wp_edit_url: ""
                    wp_post_url: ""
                    created_at: "2026-05-14T08:59:00Z"
                    updated_at: "2026-05-14T08:59:00Z"
                draft_ready:
                  summary: Готово, черновик создан в WordPress
                  value:
                    id: 42
                    keyword: "Android Game Development Services"
                    status: "draft"
                    wp_post_id: 6060
                    wp_edit_url: "https://multiagent-seo-site.com/wp-admin/post.php?post=6060&action=edit"
                    wp_post_url: ""
                    check_result:
                      ai_score: 0.12
                      plagiarism_score: 0.03
                      original: true
                      provider: "huggingface:Hello-SimpleAI/chatgpt-detector-roberta"
                    created_at: "2026-05-14T08:59:00Z"
                    updated_at: "2026-05-14T09:00:45Z"
                failed:
                  summary: Что-то упало — смотри логи сервера
                  value:
                    id: 42
                    keyword: "Android Game Development Services"
                    status: "failed"
                    wp_post_id: 0
                    wp_edit_url: ""
                    wp_post_url: ""
                    created_at: "2026-05-14T08:59:00Z"
                    updated_at: "2026-05-14T08:59:24Z"
        '400':
          description: id is not a positive integer
          content:
            text/plain: { schema: { type: string } }
        '404':
          description: No article with this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "not_found"
                message: "article with this id does not exist"

  /articles/{id}/publish:
    post:
      tags: [Articles]
      summary: Publish a draft article to WordPress
      description: |
        Flips a `draft` article to `published`: calls the WordPress REST API to
        change its status, stores the resulting public URL, and returns the
        updated row.
      operationId: publishArticle
      parameters:
        - name: id
          in: path
          required: true
          description: Internal article id from `POST /generate` or `GET /articles`.
          schema: { type: integer, format: int64 }
          example: 10
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResult'
              examples:
                published:
                  summary: Draft flipped to published — has a public URL now
                  value:
                    id: 42
                    status: "published"
                    wp_post_id: 6018
                    wp_edit_url: "https://multiagent-seo-site.com/wp-admin/post.php?post=6018&action=edit"
                    wp_post_url: "https://multiagent-seo-site.com/crown-play-casino-review/"
                    updated_at: "2026-05-14T09:05:33Z"
        '400':
          description: |
            Either `id` is not a positive integer, or the article has no
            WordPress draft yet (generation never reached CreateDraft).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "no_draft"
                message: "article has no WordPress draft yet (generation likely failed)"
        '404':
          description: No article with this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "not_found"
                message: "article with this id does not exist"
        '409':
          description: Already published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "already_published"
                message: "article is already published"
        '500':
          description: WordPress or DB failure. See server logs.

components:
  schemas:
    GenerateRequest:
      type: object
      required: [keyword]
      properties:
        keyword:
          type: string
          maxLength: 200
          example: "как выбрать ноутбук"
        site:
          type: string
          description: |
            Алиас WordPress-сайта из конфига (`wordpress.<alias>` в `config.yaml`),
            на котором будет создан черновик статьи. Если поле не передано или
            пустое — используется `default`. Для добавления нового сайта в этот
            список заведи новую запись в `wordpress:` и перезапусти сервис.

            На момент написания доступны: `default`, `playpulse`.
          example: "playpulse"
          default: "default"
        min_words:
          type: integer
          minimum: 0
          description: |
            Prompt-level minimum article length (instructs the model).
            `0` / omitted → fall back to `article.minWords` from settings.yaml.
          example: 50
        max_words:
          type: integer
          minimum: 0
          description: |
            Prompt-level maximum article length. Must be ≥ `min_words` when both
            are non-zero. `0` / omitted → fall back to `article.maxWords`.
          example: 100
        max_tokens:
          type: integer
          minimum: 0
          description: |
            Hard API cap on output tokens per LLM call (applies to all 3 stages).
            Useful for cheap tests: e.g. `400` keeps a request well under a cent.
            `0` / omitted → derived as `max_words*3 + 200`, or provider default
            if `max_words` is also 0.
          example: 400
        language:
          type: string
          description: Override for `article.language` (e.g. `ru`, `en`, `uk`).
          example: "en"
        site_topic:
          type: string
          description: Override for `article.siteTopic` (niche context the brief will use).
          example: "personal finance"
        extra_rules:
          type: string
          description: Override for `article.extraRules` (additional instructions to all 3 stages).
          example: "never mention competitors"
        provider:
          type: string
          enum: [groq, claude, anthropic]
          description: |
            Switch LLM provider for this request. `""` / omitted → config default.
            Requires the matching API key in config (`CF_LLM_GROQ_API_KEY` or
            `CF_LLM_CLAUDE_API_KEY`).
          example: "claude"
        model:
          type: string
          description: |
            Override model name for the selected provider. `""` / omitted →
            config default.
          example: "claude-haiku-4-5-20251001"
        auto_publish:
          type: boolean
          default: false
          description: |
            When `true`, publishes the WP draft to the site immediately after
            generation. The response then has `status: "published"` and a
            non-empty `wp_post_url`. If publishing fails, the article stays
            as a draft and the failure is reported in `auto_publish_error`.
          example: false
        max_cycles:
          type: integer
          minimum: 0
          description: |
            Max number of humanize rewrite cycles when the originality check
            fails. `0` / omitted → falls back to `checker.maxCycles` from
            settings (default 3). Set to `1` in tests to keep runs short.
          example: 1
        ai_threshold:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: |
            AI-detection threshold (0.0–1.0). The article passes when
            `ai_score < ai_threshold`. `0` / omitted → falls back to
            `checker.aiThreshold` from settings (default 0.8).
            Lower = stricter (rewrites more aggressively).
          example: 0.5
        include_images:
          type: boolean
          description: |
            Whether to render Pexels images for `[IMG | ...]` placeholders the LLM emits.
            - `true` — fetch images from Pexels and embed `<figure>` with attribution.
              Requires `CF_PEXELS_API_KEY` on the server; otherwise placeholders are stripped.
            - `false` — strip all `[IMG | ...]` placeholders, no images in the article.
            - omitted — use the server default (on when Pexels is configured, off otherwise).
          example: true

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: "Stable machine-readable code (e.g. `no_cluster`)."
          example: "no_cluster"
        message:
          type: string
          description: "Human-readable detail."
        keyword:
          type: string
          description: "Echoed back when the error relates to a specific topic."

    GenerateAccepted:
      type: object
      description: |
        Ответ на `POST /generate`. Возвращается **сразу** (за 1–2 секунды),
        ещё до начала генерации. Содержит результат Sheets-лукапа (чтобы
        клиент видел, какой кластер и H1 ушли в LLM) и `status_url` для
        поллинга.
      properties:
        id:
          type: integer
          format: int64
          description: Внутренний id новой статьи в БД. Используется в `/articles/{id}` и `/articles/{id}/publish`.
          example: 42
        keyword:
          type: string
          example: "Android Game Development Services"
        status:
          type: string
          enum: [generating]
          description: Всегда `generating` в момент возврата 202.
          example: "generating"
        created_at:
          type: string
          format: date-time
        target_keywords:
          type: array
          items: { type: string }
          description: |
            Все ключевые слова, прочитанные из ячейки B (через запятую) на
            вкладке `casino2` для строки с совпадающим title. Передаются в LLM
            как target keywords.
          example:
            - "Android Game Development"
            - "Android Game Development Services"
            - "Android Game Development Company"
        suggested_title:
          type: string
          description: |
            Заголовок (H1) из колонки C. LLM получит инструкцию использовать
            именно эту формулировку, без пересочинений.
          example: "Android Game Development Services"
        site:
          type: string
          description: |
            WordPress-сайт, на котором будет создан черновик.
            Совпадает с переданным `site` в запросе (или `default`, если не передан).
          example: "default"
        provider:
          type: string
          description: LLM-провайдер для этой генерации (`claude` или `groq`).
          example: "claude"
        model:
          type: string
          description: Конкретная модель.
          example: "claude-sonnet-4-6"
        status_url:
          type: string
          description: Относительный путь, куда поллить статус.
          example: "/articles/42"

    ArticleResult:
      type: object
      description: |
        Полное состояние статьи из БД. Возвращается на `GET /articles/{id}`.
        Поллите этот эндпоинт после `POST /generate` пока `status` не
        перестанет быть `generating`.
      properties:
        id:          { type: integer, format: int64, example: 42 }
        keyword:     { type: string, example: "Android Game Development Services" }
        site:
          type: string
          description: WordPress-сайт, в который ушла статья. Алиас из `wordpress:` конфига.
          example: "default"
        status:
          type: string
          enum: [generating, draft, published, failed]
          description: |
            Жизненный цикл:
            - `generating` — пайплайн ещё работает в фоне.
            - `draft` — успешно сгенерирована и создан черновик в WordPress.
            - `published` — статья опубликована на сайте.
            - `failed` — что-то упало; смотри логи сервера.
          example: "draft"
        wp_post_id:
          type: integer
          format: int64
          description: ID черновика в WordPress. `0` пока `status=generating` или `failed`.
          example: 6060
        wp_edit_url:
          type: string
          description: Прямая ссылка на черновик в админке WP. Пусто пока не готово.
          example: "https://multiagent-seo-site.com/wp-admin/post.php?post=6060&action=edit"
        wp_post_url:
          type: string
          description: Публичный URL статьи. Заполнен только при `status=published`.
          example: ""
        competitor_data:
          type: object
          description: |
            SERP-выдача из DataForSEO, по которой строился бриф. Появляется
            на шаге 1 пайплайна, ещё до завершения генерации.
        check_result:
          $ref: '#/components/schemas/CheckResult'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Article:
      type: object
      properties:
        ID:        { type: integer, format: int64, example: 1 }
        Keyword:   { type: string, example: "high flyer casino" }
        Site:      { type: string, example: "default", description: "WordPress site alias (from `wordpress:` config)" }
        Status:
          type: string
          enum: [generating, draft, published, failed]
          example: draft
        WPPostID:  { type: integer, format: int64, example: 42 }
        WPEditURL: { type: string, example: "https://site.com/wp-admin/post.php?post=42&action=edit" }
        WPPostURL: { type: string, example: "" }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }

    PublishResult:
      type: object
      properties:
        id:          { type: integer, format: int64, example: 10 }
        site:        { type: string, example: "default", description: "WordPress site alias the article was published to." }
        status:
          type: string
          enum: [published]
          example: published
        wp_post_id:  { type: integer, format: int64, example: 6018 }
        wp_edit_url: { type: string, example: "https://site.com/wp-admin/post.php?post=6018&action=edit" }
        wp_post_url: { type: string, example: "https://site.com/online-casino-australia/" }
        updated_at:  { type: string, format: date-time }

    CheckResult:
      type: object
      description: Outcome of one originality check (AI detection + plagiarism).
      properties:
        ai_score:
          type: number
          format: float
          description: Fraction of text classified as AI-generated (0.0–1.0). Lower is better.
          example: 0.31
        plagiarism_score:
          type: number
          format: float
          description: Fraction of text matched against existing sources (0.0–1.0).
          example: 0.04
        original:
          type: boolean
          description: "`true` when `ai_score < ai_threshold` (passes the gate)."
          example: true
        provider:
          type: string
          description: Which checker service produced this result.
          example: "huggingface model=Hello-SimpleAI/chatgpt-detector-roberta"
        issues:
          type: array
          items: { type: string }
          description: Human-readable reasons the article was flagged. Empty when passing.
        sentences_flagged:
          type: array
          items: { type: string }
          description: Specific sentences detected as AI-written. Fed back into the humanize prompt.
        report_url:
          type: string
          description: Link to full report on the provider's site (if available).

    CheckCycle:
      type: object
      description: One check + (optional) rewrite iteration.
      properties:
        cycle:
          type: integer
          description: 1-based iteration index.
          example: 1
        threshold:
          type: number
          format: float
          description: "`ai_threshold` applied this cycle."
          example: 0.5
        check_result:
          $ref: '#/components/schemas/CheckResult'

    TokenUsage:
      type: object
      description: Per-step LLM token consumption. `total_*` = sum of all `steps`.
      properties:
        steps:
          type: array
          items:
            type: object
            properties:
              step:
                type: string
                description: Pipeline step that made the LLM call (`brief`, `writer`, `editor`, `humanize_1`, ...).
                example: "brief"
              input_tokens:  { type: integer, example: 820 }
              output_tokens: { type: integer, example: 312 }
        total_input:  { type: integer, example: 3462 }
        total_output: { type: integer, example: 1111 }
