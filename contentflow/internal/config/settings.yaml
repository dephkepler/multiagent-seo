llm:
  model: "llama-3.3-70b-versatile" # groq free tier; prod: claude-sonnet-4-6

sheets:
  sheet: "casino2"        # worksheet (tab) name
  topicColumn: "A"        # column with the article title (lookup key — matched against the /generate "keyword")
  keywordColumn: "B"      # column with a comma-separated list of target keywords for the article
  titleColumn: "C"        # column with the article H1; empty string disables
  headerRow: true         # skip the first row (headers)

worker:
  pollInterval: 60s

article:
  language: "ru"   # ru, en, uk
  minWords: 1500
  maxWords: 3000
  siteTopic: ""    # site niche, e.g. "personal finance"
  extraRules: ""   # extra rules for agents, e.g. "never mention competitors"
