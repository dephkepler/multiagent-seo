# Локальный PostgreSQL для SEO OS (Alembic, worker, demo).
# Запуск: docker compose up -d postgres
# Остановка: docker compose down  (данные в volume сохраняются)
# Сброс данных: docker compose down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: seo_os_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seo_os}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seo_os}
      POSTGRES_DB: ${POSTGRES_DB:-seo_os}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - seo_os_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  seo_os_pgdata:
