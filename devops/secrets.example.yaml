# DO NOT commit real values. This file documents the K8s Secrets that must
# exist in the cluster before deploying contentflow.
#
# Create with:
#   kubectl create secret generic <name> --from-literal=key=value -n seo
#   kubectl create secret generic contentflow-sheets \
#     --from-file=credentials.json=./credentials.json -n seo

---
# Full Postgres DSN — includes user + password.
# Format: postgres://contentflow:<password>@<host>:5432/contentflow
apiVersion: v1
kind: Secret
metadata:
  name: contentflow-db
  namespace: seo
stringData:
  url: "postgres://contentflow:CHANGEME@postgres.postgres.svc.cluster.local:5432/contentflow"

---
# LLM provider API keys.
# apiKey    — primary key for the default provider (groq or openai)
# groqApiKey   — used when per-request provider=groq (optional if same as apiKey)
# claudeApiKey — used when per-request provider=claude/anthropic (optional)
apiVersion: v1
kind: Secret
metadata:
  name: contentflow-llm
  namespace: seo
stringData:
  apiKey: "gsk_CHANGEME"
  groqApiKey: ""
  claudeApiKey: ""

---
# WordPress application password (Settings → Application Passwords).
apiVersion: v1
kind: Secret
metadata:
  name: contentflow-wp
  namespace: seo
stringData:
  appPassword: "xxxx xxxx xxxx xxxx xxxx xxxx"

---
# Telegram bot token from @BotFather.
apiVersion: v1
kind: Secret
metadata:
  name: contentflow-telegram
  namespace: seo
stringData:
  botToken: "123456789:CHANGEME"

---
# DataForSEO account password.
apiVersion: v1
kind: Secret
metadata:
  name: contentflow-dfs
  namespace: seo
stringData:
  password: "CHANGEME"

---
# AI-content checker API key.
# Leave apiKey empty when checker.provider=mock (no key required).
apiVersion: v1
kind: Secret
metadata:
  name: contentflow-checker
  namespace: seo
stringData:
  apiKey: ""

---
# Google Sheets service account credentials JSON.
# kubectl create secret generic contentflow-sheets \
#   --from-file=credentials.json=./credentials.json -n seo
apiVersion: v1
kind: Secret
metadata:
  name: contentflow-sheets
  namespace: seo
stringData:
  credentials.json: |
    {
      "type": "service_account",
      "project_id": "CHANGEME",
      ...
    }
