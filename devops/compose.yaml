name: multiagent-seo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ../backend
      dockerfile: ../devops/docker/backend.Dockerfile
    ports:
      - "${APP_HOST_PORT}:8080"
    env_file:
      - ../backend/.env
    environment:
      # Container overrides — the host values in .env don't apply inside the compose network.
      CF_APP_HOST: "0.0.0.0"
      CF_DB_HOST: postgres
      CF_DB_PORT: "5432"
      CF_DB_USER: ${POSTGRES_USER}
      CF_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CF_DB_NAME: ${POSTGRES_DB}
      CF_SHEETS_CREDENTIALS_FILE: /app/credentials.json
    volumes:
      # Google service-account creds for the Sheets adapters (read-only mount).
      - ../backend/credentials.json:/app/credentials.json:ro
      # Personal-account MTProto session (see cmd/tgsession) — read-write,
      # not read-only like credentials.json above: the session file gets
      # updated by the client itself while connected, and without a volume
      # here it would live only in the container's own filesystem and be
      # lost on every rebuild, forcing a fresh interactive login each time.
      - ../backend/tgsession.json:/app/tgsession.json
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: ../devops/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${APP_HOST_PORT}}
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      - app

  # The client Mini App. Separate from `frontend` because it is a different
  # audience with a different login: clients authenticate by a signed Telegram
  # launch, staff by a password, and the two must not share a bundle.
  #
  # Enable it with `--profile clientapp`, so a plain `up` on a host that has no
  # front door for it changes nothing.
  #
  # Published on 127.0.0.1 only, and deliberately: this serves plain HTTP, and
  # Telegram will not open a Mini App on a plain http origin. HTTPS comes from
  # the Caddy that owns port 80 and 8443 on the host — see clientapp/Caddyfile.
  clientapp:
    profiles: [ clientapp ]
    build:
      context: ../clientapp
      dockerfile: ../devops/docker/clientapp.Dockerfile
      args:
        NEXT_PUBLIC_TG_LINK: ${NEXT_PUBLIC_TG_LINK:-}
    ports:
      # Loopback only, for checking the container from the host. Never the path
      # Telegram uses: this serves plain HTTP, and a Mini App will not open on
      # an http origin.
      - "127.0.0.1:${CLIENTAPP_HOST_PORT:-3002}:3002"
    networks:
      # default: reaches app:8080 for the /api proxy.
      default: {}
      # ingress: the network of whatever Caddy owns port 80 and 443 on this
      # host, so it can reach this container by name. Joining its network
      # instead of publishing a host port is what keeps the change on that side
      # down to one reverse_proxy line — and a host port would not work anyway,
      # since the publish above is loopback-only and a container's localhost is
      # its own.
      ingress:
        aliases:
          - abalis-clientapp
    depends_on:
      - app

networks:
  default: {}
  # Created by the neighbouring project, not by us — which is why the clientapp
  # service sits behind a profile: `up` without it never touches this, and a
  # host that has no such front door is unaffected.
  ingress:
    external: true
    name: ${INGRESS_NETWORK:-tracker-bot_default}

volumes:
  postgres_data:
    name: contentflow_postgres_data
