name: multiagent-seo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ../backend
      dockerfile: ../devops/docker/backend.Dockerfile
    ports:
      - "${APP_HOST_PORT}:8080"
    env_file:
      - ../backend/.env
    environment:
      # Container overrides — the host values in .env don't apply inside the compose network.
      CF_APP_HOST: "0.0.0.0"
      CF_DB_HOST: postgres
      CF_DB_PORT: "5432"
      CF_DB_USER: ${POSTGRES_USER}
      CF_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CF_DB_NAME: ${POSTGRES_DB}
      CF_SHEETS_CREDENTIALS_FILE: /app/credentials.json
    volumes:
      # Google service-account creds for the Sheets adapters (read-only mount).
      - ../backend/credentials.json:/app/credentials.json:ro
      # Personal-account MTProto session (see cmd/tgsession) — read-write,
      # not read-only like credentials.json above: the session file gets
      # updated by the client itself while connected, and without a volume
      # here it would live only in the container's own filesystem and be
      # lost on every rebuild, forcing a fresh interactive login each time.
      - ../backend/tgsession.json:/app/tgsession.json
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: ../devops/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${APP_HOST_PORT}}
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      - app

  # The client Mini App. Separate from `frontend` because it is a different
  # audience with a different login: clients authenticate by a signed Telegram
  # launch, staff by a password, and the two must not share a bundle.
  #
  # Only started when CLIENTAPP_DOMAIN is set — Telegram will not open a Mini
  # App without HTTPS, and Caddy cannot get a certificate for a name that does
  # not resolve here. Enable it with `--profile clientapp`.
  clientapp:
    profiles: [ clientapp ]
    build:
      context: ../clientapp
      dockerfile: ../devops/docker/clientapp.Dockerfile
      args:
        NEXT_PUBLIC_TG_LINK: ${NEXT_PUBLIC_TG_LINK:-}
    environment:
      CLIENTAPP_DOMAIN: ${CLIENTAPP_DOMAIN:?set CLIENTAPP_DOMAIN in backend/.env to a hostname that resolves to this server}
    ports:
      # 80 is not optional: Let's Encrypt's HTTP challenge needs it, and
      # without the challenge there is no certificate and no Mini App.
      - "80:80"
      - "443:443"
    volumes:
      # Certificates and the ACME account key. Without this every restart asks
      # Let's Encrypt for a new certificate and walks into their rate limit.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  postgres_data:
    name: contentflow_postgres_data
  caddy_data:
  caddy_config:
