name: contentflow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Migrations are applied separately (host: `make migrate-up`), not as a compose
  # service — matches the reference, whose compose holds only infra services.
  app:
    build:
      context: ../backend
      dockerfile: ../devops/docker/backend.Dockerfile
    ports:
      - "${APP_HOST_PORT}:8080"
    environment:
      # 0.0.0.0 so the server is reachable from the host through the port map;
      # the localhost default would only bind inside the container.
      CF_APP_HOST: "0.0.0.0"
      CF_DB_HOST: postgres
      CF_DB_PORT: "5432"
      CF_DB_USER: ${POSTGRES_USER}
      CF_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CF_DB_NAME: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
