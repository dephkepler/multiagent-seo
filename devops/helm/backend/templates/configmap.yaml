apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-config
  namespace: {{ .Values.namespace }}
data:
  # LLM
  CF_LLM_PROVIDER: {{ .Values.configuration.llm.provider | quote }}
  CF_LLM_MODEL: {{ .Values.configuration.llm.model | quote }}

  # Google Sheets (non-secret)
  CF_SHEETS_CREDENTIALS_FILE: /app/secrets/google-credentials.json
  CF_SHEETS_SPREADSHEET_ID: {{ .Values.configuration.sheets.spreadsheetId | quote }}
  CF_SHEETS_SHEET: {{ .Values.configuration.sheets.sheet | quote }}
  CF_SHEETS_TOPIC_COLUMN: {{ .Values.configuration.sheets.topicColumn | quote }}
  CF_SHEETS_KEYWORD_COLUMN: {{ .Values.configuration.sheets.keywordColumn | quote }}
  CF_SHEETS_TITLE_COLUMN: {{ .Values.configuration.sheets.titleColumn | quote }}
  CF_SHEETS_HEADER_ROW: {{ .Values.configuration.sheets.headerRow | quote }}

  # WordPress (non-secret)
  CF_WORDPRESS_URL: {{ .Values.connections.wordpress.url | quote }}
  CF_WORDPRESS_USER: {{ .Values.connections.wordpress.user | quote }}

  # DataForSEO (non-secret)
  CF_DATAFORSEO_LOGIN: {{ .Values.connections.dataforseo.login | quote }}
  CF_DATAFORSEO_SERP_LIMIT: {{ .Values.connections.dataforseo.serpLimit | quote }}

  # Telegram (non-secret)
  CF_TELEGRAM_ALLOWED_USERS: {{ .Values.connections.telegram.allowedUsers | quote }}

  # Worker
  CF_WORKER_POLL_INTERVAL: {{ .Values.configuration.worker.pollInterval | quote }}

  # Article
  CF_ARTICLE_LANGUAGE: {{ .Values.configuration.article.language | quote }}
  CF_ARTICLE_MIN_WORDS: {{ .Values.configuration.article.minWords | quote }}
  CF_ARTICLE_MAX_WORDS: {{ .Values.configuration.article.maxWords | quote }}
  CF_ARTICLE_SITE_TOPIC: {{ .Values.configuration.article.siteTopic | quote }}
  CF_ARTICLE_EXTRA_RULES: {{ .Values.configuration.article.extraRules | quote }}

  # Checker (non-secret)
  CF_CHECKER_PROVIDER: {{ .Values.configuration.checker.provider | quote }}
  CF_CHECKER_AI_THRESHOLD: {{ .Values.configuration.checker.aiThreshold | quote }}
  CF_CHECKER_MAX_CYCLES: {{ .Values.configuration.checker.maxCycles | quote }}
