apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.deployment.replicas }}
  revisionHistoryLimit: {{ .Values.deployment.revisionHistoryLimit }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ .Values.labels }}
  template:
    metadata:
      annotations: {{ toYaml .Values.deployment.annotations | nindent 8 }}
      labels:
        app: {{ .Values.labels }}
        namespace: {{ .Values.namespace }}
    spec:
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: {{ .Values.registry.secret }}
      initContainers:
        - name: migrate
          image: {{ .Values.image }}:{{ .Values.version }}
          imagePullPolicy: IfNotPresent
          command: ["/app/migrate"]
          env:
            - name: CF_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.db }}
                  key: url
      containers:
        - name: {{ .Values.name }}
          image: {{ .Values.image }}:{{ .Values.version }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.configuration.server.port }}
              name: http
          volumeMounts:
            - name: google-credentials
              mountPath: /app/secrets/google-credentials.json
              subPath: credentials.json
              readOnly: true
          envFrom:
            - configMapRef:
                name: {{ .Values.name }}-config
          env:
            - name: CONFIGMAP_HASH
              value: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
            # ---- secrets ----
            - name: CF_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.db }}
                  key: url
            - name: CF_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.llm }}
                  key: apiKey
            - name: CF_LLM_GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.llm }}
                  key: groqApiKey
                  optional: true
            - name: CF_LLM_CLAUDE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.llm }}
                  key: claudeApiKey
                  optional: true
            - name: CF_WORDPRESS_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.wordpress }}
                  key: appPassword
            - name: CF_TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.telegram }}
                  key: botToken
            - name: CF_DATAFORSEO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dataforseo }}
                  key: password
            - name: CF_CHECKER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.checker }}
                  key: apiKey
                  optional: true
      volumes:
        - name: google-credentials
          secret:
            secretName: {{ .Values.secrets.sheets }}
