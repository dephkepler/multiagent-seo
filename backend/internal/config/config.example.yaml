llm:
  apiKey: "gsk_xxxx"
  groqApiKey: "gsk_xxxx"
  claudeApiKey: "sk-ant-xxxx"

database:
  url: "postgres://contentflow:password@localhost:5432/contentflow?sslmode=disable"

sheets:
  credentialsFile: "./credentials.json"
  spreadsheetId: ""

# WordPress sites the pipeline can publish to. Add as many as you need.
# The "default" key is mandatory and is used when /generate omits "site".
# All other aliases become valid values for the request "site" field.
wordpress:
  default:
    url: "https://your-site.com"
    user: "admin"
    appPassword: "xxxx xxxx xxxx xxxx"
  # secondary:
  #   url: "https://another-site.com"
  #   user: "admin"
  #   appPassword: "xxxx xxxx xxxx xxxx"

telegram:
  botToken: "123456789:xxxx"
  allowedUsers:
    - "123456789"

dataforseo:
  login: "your@email.com"
  password: "xxxx"

checker:
  provider: "huggingface"
  apiKey: "hf_xxxx"
  model: "Hello-SimpleAI/chatgpt-detector-roberta"
  aiThreshold: 0.8
  maxCycles: 3

server:
  addr: ":8080"
  readTimeout: 10s
  writeTimeout: 5m
  # How long Wait blocks on in-flight generations after SIGTERM
  # before the pool is closed and the process exits.
  shutdownWaitTimeout: 30s
  # Hard ceiling for one generation pipeline. SIGTERM cancels earlier.
  backgroundJobTimeout: 15m
