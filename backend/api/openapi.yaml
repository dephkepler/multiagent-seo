          format: int64

    LeadStatsSourceValue:
      type: object
      description: >-
        First-touch cohort attribution, not a raw lead count — key is
        leads.page of the client's first-ever lead ("" when the lead came
        without one, e.g. email); consulted_ever/cased_ever/revenue are
        followed with no date bound, same as LeadStatsFunnel.
      required: [ key, leads, consulted_ever, cased_ever, revenue_earned, case_paid ]
      properties:
        key:
