openapi: 3.0.3
info:
  title: ContentFlow API
  description: AI SEO content generation platform.
  version: 0.1.0

servers:
  - url: /
    description: Same origin as the docs (works on any host/port)
  - url: https://multiagent-seo.8cell.tech
    description: Staging

tags:
  - name: Health
    description: Liveness and readiness checks
  - name: Auth
    description: Authentication
  - name: WordPress Sites
    description: WordPress publishing targets
  - name: Articles
    description: SEO article generation and publishing
  - name: Link Building
    description: Donor-website login and backlink placement
  - name: API Tokens
    description: Long-lived per-user API keys
  - name: Clients
    description: Client base with derived funnel segment (обращение → консультація → дело)
  - name: Vault
    description: Staff password/credential storage, plain text (no encryption yet)

paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [ Health ]
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service is degraded (e.g. database unreachable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /auth/login:
    post:
      operationId: login
      tags: [ Auth ]
      summary: Authenticate and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users:
    get:
      operationId: listUsers
      security:
        - bearerAuth: [ admin ]
      tags: [ Auth ]
      summary: List users
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /api-tokens:
    post:
      operationId: createApiToken
      security:
        - bearerAuth: [ admin ]
      tags: [ API Tokens ]
      summary: Create an API token (the secret is returned only once)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiTokenRequest"
      responses:
        "201":
          description: Created — save the token now, it can't be retrieved later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      operationId: listApiTokens
      security:
        - bearerAuth: [ admin ]
      tags: [ API Tokens ]
      summary: List your API tokens (metadata only)
      responses:
        "200":
          description: Your active tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiToken"

  /api-tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteApiToken
      security:
        - bearerAuth: [ admin ]
      tags: [ API Tokens ]
      summary: Revoke an API token
      responses:
        "204":
          description: Revoked
        "404":
          $ref: "#/components/responses/NotFound"

  /wordpress-sites:
    get:
      operationId: listWordpressSites
      security:
        - bearerAuth: [ admin ]
      tags: [ WordPress Sites ]
      summary: List WordPress sites
      responses:
        "200":
          description: All non-deleted sites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WordpressSite"
    post:
      operationId: createWordpressSite
      security:
        - bearerAuth: [ admin ]
      tags: [ WordPress Sites ]
      summary: Add a WordPress site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWordpressSiteRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordpressSite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /wordpress-sites/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getWordpressSite
      security:
        - bearerAuth: [ admin ]
      tags: [ WordPress Sites ]
      summary: Get a WordPress site
      responses:
        "200":
          description: Site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordpressSite"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateWordpressSite
      security:
        - bearerAuth: [ admin ]
      tags: [ WordPress Sites ]
      summary: Update a WordPress site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWordpressSiteRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordpressSite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteWordpressSite
      security:
        - bearerAuth: [ admin ]
      tags: [ WordPress Sites ]
      summary: Soft-delete a WordPress site
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /generate:
    post:
      operationId: generateArticle
      security:
        - bearerAuth: [ admin ]
      tags: [ Articles ]
      summary: Queue an article for generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequest"
      responses:
        "202":
          description: Generation accepted; poll GET /articles/{id} for status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /generate/batch:
    post:
      operationId: generateBatch
      security:
        - bearerAuth: [ admin ]
      tags: [ Articles ]
      summary: Queue a batch from the next N unused sheet topics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateBatchRequest"
      responses:
        "202":
          description: Batch queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateBatchAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"

  /articles:
    get:
      operationId: listArticles
      security:
        - bearerAuth: [ admin ]
      tags: [ Articles ]
      summary: List articles (paginated, newest first)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: A page of articles, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleList"

  /articles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getArticle
      security:
        - bearerAuth: [ admin ]
      tags: [ Articles ]
      summary: Get an article
      responses:
        "200":
          description: Article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          $ref: "#/components/responses/NotFound"

  /articles/{id}/publish:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: publishArticle
      security:
        - bearerAuth: [ admin ]
      tags: [ Articles ]
      summary: Publish a draft article
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /articles/{id}/rating:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: rateArticle
      security:
        - bearerAuth: [ admin ]
      tags: [ Articles ]
      summary: Rate an article (copywriter 👍/👎)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateArticleRequest"
      responses:
        "204":
          description: Rated
        "404":
          $ref: "#/components/responses/NotFound"

  /linkbuilding/place-backlinks:
    post:
      operationId: placeBacklinks
      security:
        - bearerAuth: [ admin ]
      tags: [ Link Building ]
      summary: Place a backlink to one of our WordPress sites in each suitable donor's latest post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceBacklinksRequest"
      responses:
        "202":
          description: Placement accepted; per-donor status is written to the sheet's I column
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceBacklinksAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"

  /linkbuilding/placements:
    get:
      operationId: listPlacements
      security:
        - bearerAuth: [ admin ]
      tags: [ Link Building ]
      summary: Per-donor results of a placement run
      parameters:
        - name: run_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Placements for the run, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Placement"

  /linkbuilding/placements/history:
    get:
      operationId: listPlacementHistory
      security:
        - bearerAuth: [ admin ]
      tags: [ Link Building ]
      summary: Successful placements across all runs (paginated, newest first)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: A page of successful placements, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacementList"

  /linkbuilding/placements/{run_id}/cancel:
    parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: cancelPlacement
      security:
        - bearerAuth: [ admin ]
      tags: [ Link Building ]
      summary: Request cancellation of a running placement
      responses:
        "202":
          description: Cancellation requested

  /emailscrape:
    post:
      operationId: scrapeEmails
      security:
        - bearerAuth: [ admin ]
      tags: [ Email Scrape ]
      summary: Crawl the sites listed in a sheet and scrape their email addresses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScrapeEmailsRequest"
      responses:
        "202":
          description: Scrape accepted; found emails and per-site status are written back to the sheet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeEmailsAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"

  /emailscrape/jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getScrapeJob
      security:
        - bearerAuth: [ admin ]
      tags: [ Email Scrape ]
      summary: Get the progress and state of a scrape job
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeJob"
        "404":
          $ref: "#/components/responses/NotFound"

  /emailscrape/jobs/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: cancelScrapeJob
      security:
        - bearerAuth: [ admin ]
      tags: [ Email Scrape ]
      summary: Request cancellation of a running scrape job
      responses:
        "202":
          description: Cancellation requested
        "404":
          $ref: "#/components/responses/NotFound"

  /leads/stats:
    get:
      operationId: getLeadStats
      security:
        - bearerAuth: [ admin ]
      tags: [ Leads ]
      summary: Aggregate lead/consultation stats over a date range, for the admin dashboard
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: group_by
          in: query
          schema:
            type: string
            enum: [ day, month ]
            default: day
      responses:
        "200":
          description: Aggregated stats for the range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadStats"
        "400":
          $ref: "#/components/responses/BadRequest"

  /clients:
    get:
      operationId: listClientSegments
      security:
        - bearerAuth: [ admin ]
      tags: [ Clients ]
      summary: Clients with their derived funnel segment and tags, filtered/paginated — no date range, this is a snapshot of all-time activity, not a period aggregate
      parameters:
        - name: id
          in: query
          description: Exact client id — narrows to a single client (used by the client detail page instead of fetching every client)
          schema:
            type: string
        - name: segment
          in: query
          schema:
            $ref: "#/components/schemas/Segment"
        - name: tag
          in: query
          schema:
            type: string
        - name: search
          in: query
          description: Case-insensitive substring match against name or phone
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [ activity, ltv ]
            default: activity
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: A page of clients with segment and tags, plus all-time segment counts for the pill row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientList"
        "400":
          $ref: "#/components/responses/BadRequest"

  /clients/{id}/segment:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: setClientSegmentOverride
      security:
        - bearerAuth: [ admin ]
      tags: [ Clients ]
      summary: Pin a client's segment by hand, or pass null to clear the override and fall back to the calculated value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetClientSegmentOverrideRequest"
      responses:
        "204":
          description: Override saved (or cleared)
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /clients/{id}/tags:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: addClientTag
      security:
        - bearerAuth: [ admin ]
      tags: [ Clients ]
      summary: Attach a tag to a client — tag must be one of GET /clients/tag-defs' labels; idempotent, adding a tag already present is not an error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddClientTagRequest"
      responses:
        "204":
          description: Tag added
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /clients/{id}/tags/{tag}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: tag
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: removeClientTag
      security:
        - bearerAuth: [ admin ]
      tags: [ Clients ]
      summary: Detach a staff-added tag from a client — idempotent, removing a tag that isn't present is not an error
      responses:
        "204":
          description: Tag removed (or wasn't present)

  /clients/tag-defs:
    get:
      operationId: listClientTagDefs
      security:
        - bearerAuth: [ admin ]
      tags: [ Clients ]
      summary: The curated manual-tag vocabulary — AddClientTag only accepts a tag already listed here
      responses:
        "200":
          description: Every tag definition, grouped by category then alphabetical within it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagDefList"
    post:
      operationId: createClientTagDef
      security:
        - bearerAuth: [ admin ]
      tags: [ Clients ]
      summary: Add a new entry to the tag vocabulary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTagDefRequest"
      responses:
        "204":
          description: Tag definition created
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: A tag definition with this label already exists

  /clients/tag-defs/{label}:
    parameters:
      - name: label
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateClientTagDef
      security:
        - bearerAuth: [ admin ]
      tags: [ Clients ]
      summary: Rename a tag definition and/or move it to another category — omitted fields are left as-is; a rename applies to every client carrying the old label in the same operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTagDefRequest"
      responses:
        "204":
          description: Renamed
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A tag definition with the new label already exists
    delete:
      operationId: deleteClientTagDef
      security:
        - bearerAuth: [ admin ]
      tags: [ Clients ]
      summary: Remove a tag definition — every client carrying it loses the tag too (idempotent, removing an already-gone label is not an error)
      responses:
        "204":
          description: Deleted (or already gone)

  /clients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getClientDetail
      security:
        - bearerAuth: [ admin ]
      tags: [ Clients ]
      summary: One client's full card — leads, consultations, cases, manual notes, money actually collected
      responses:
        "200":
          description: Client card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateClient
      security:
        - bearerAuth: [ admin ]
      tags: [ Clients ]
      summary: Edit a client's own name/phone from the client card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientRequest"
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteClient
      security:
        - bearerAuth: [ admin ]
      tags: [ Clients ]
      summary: Delete a client record — refused (409) if it has any leads, consultations, or cases, so real business history can't be destroyed by accident
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /clients/{id}/notes:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: addClientNote
      security:
        - bearerAuth: [ admin ]
      tags: [ Clients ]
      summary: Add a manual call/contact log entry to a client's card — free text staff types in after a call, there's no phone system integration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddClientNoteRequest"
      responses:
        "201":
          description: Note added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientNote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /vault-entries:
    get:
      operationId: listVaultEntries
      security:
        - bearerAuth: [ admin ]
      tags: [ Vault ]
      summary: List saved password/credential entries
      responses:
        "200":
          description: All entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VaultEntry"
    post:
      operationId: createVaultEntry
      security:
        - bearerAuth: [ admin ]
      tags: [ Vault ]
      summary: Add a password/credential entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVaultEntryRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultEntry"
        "400":
          $ref: "#/components/responses/BadRequest"

  /vault-entries/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateVaultEntry
      security:
        - bearerAuth: [ admin ]
      tags: [ Vault ]
      summary: Update a password/credential entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVaultEntryRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteVaultEntry
      security:
        - bearerAuth: [ admin ]
      tags: [ Vault ]
      summary: Delete a password/credential entry
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /finance/report:
    get:
      operationId: getFinanceReport
      security:
        - bearerAuth: [ admin ]
      tags: [ Finance ]
      summary: P&L by month — income read from consultations/case payments (never re-entered by hand), expenses summed per category, plus running balance and acquisition metrics
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: One row per calendar month in range, including months with no activity, plus an "Итого" column
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceReport"
        "400":
          $ref: "#/components/responses/BadRequest"

  /finance/gaps:
    get:
      operationId: getFinanceGaps
      security:
        - bearerAuth: [ admin ]
      tags: [ Finance ]
      summary: Money the P&L cannot account for because of how a record was left — the to-do list behind the numbers
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: One row per gap that actually has something in it; amount is 0 where no honest figure exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataGapList"
        "400":
          $ref: "#/components/responses/BadRequest"

  /finance/period:
    get:
      operationId: getFinancePeriod
      security:
        - bearerAuth: [ admin ]
      tags: [ Finance ]
      summary: The months the data actually spans — what the period picker offers, so it never proposes an empty window
      responses:
        "200":
          description: First and last month carrying any money or lead row; has_data false when the database holds none
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancePeriod"

  /finance/settlement:
    get:
      operationId: getAdvocateSettlement
      security:
        - bearerAuth: [ admin ]
      tags: [ Finance ]
      summary: What is still owed to each advocate — collected, accrued at their percentage, paid out, remainder — plus the income split it is accrued on
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: One row per advocate with money in the period, plus payouts that name nobody
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvocateSettlementList"
        "400":
          $ref: "#/components/responses/BadRequest"

  /finance/expenses:
    get:
      operationId: listExpenses
      security:
        - bearerAuth: [ admin ]
      tags: [ Finance ]
      summary: Expense ledger, newest first — includes drafts, which are excluded from every P&L number until confirmed
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ExpenseStatus"
        - name: origin
          in: query
          schema:
            $ref: "#/components/schemas/ExpenseOrigin"
        - name: payment_method
          in: query
          schema:
            $ref: "#/components/schemas/ExpensePaymentMethod"
        - name: search
          in: query
          description: Case-insensitive substring match against vendor or description
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: A page of expenses; total and sum cover the whole filtered set, not the page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseList"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: createExpense
      security:
        - bearerAuth: [ admin ]
      tags: [ Finance ]
      summary: Record a spend by hand — always posted, there is nothing to confirm about a payment a person already made
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExpenseRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "400":
          $ref: "#/components/responses/BadRequest"

  /finance/expenses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateExpense
      security:
        - bearerAuth: [ admin ]
      tags: [ Finance ]
      summary: Correct an expense — keeps its draft/posted status, so fixing a generated draft's amount does not post it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExpenseRequest"
      responses:
        "204":
          description: Updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteExpense
      security:
        - bearerAuth: [ admin ]
      tags: [ Finance ]
      summary: Delete an expense
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /finance/expenses/{id}/confirm:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: confirmExpense
      security:
        - bearerAuth: [ admin ]
      tags: [ Finance ]
      summary: Accept a generated draft into the ledger — this is the moment it starts counting in the P&L
      responses:
        "204":
          description: Confirmed
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /finance/generate:
    post:
      operationId: runAutoExpenses
      security:
        - bearerAuth: [ admin ]
      tags: [ Finance ]
      summary: Materialize the recurring templates and advocate payouts due in a month — idempotent, a repeat run inserts nothing
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunAutoExpensesRequest"
      responses:
        "200":
          description: What the pass created; skipped counts occurrences already in the ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedExpenses"
        "400":
          $ref: "#/components/responses/BadRequest"

  /finance/categories:
    get:
      operationId: listExpenseCategories
      security:
        - bearerAuth: [ admin ]
      tags: [ Finance ]
      summary: The closed expense-category vocabulary — free text would drift into three spellings of one line in the P&L
      parameters:
        - name: active_only
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Categories in display order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseCategoryList"
    post:
      operationId: createExpenseCategory
      security:
        - bearerAuth: [ admin ]
      tags: [ Finance ]
      summary: Add a category to the vocabulary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExpenseCategoryRequest"
      responses:
        "204":
          description: Created
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /finance/categories/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateExpenseCategory
      security:
        - bearerAuth: [ admin ]
      tags: [ Finance ]
      summary: Rename a category, regroup it, or retire it — the code stays, so history keeps pointing at it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExpenseCategoryRequest"
      responses:
        "204":
          description: Updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /finance/rules:
    get:
      operationId: listExpenseRules
      security:
        - bearerAuth: [ admin ]
      tags: [ Finance ]
      summary: Recurring expense templates — the monthly charges the generator materializes (hosting, telephony, retainers)
      parameters:
        - name: active_only
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseRuleList"
    post:
      operationId: createExpenseRule
      security:
        - bearerAuth: [ admin ]
      tags: [ Finance ]
      summary: Add a recurring expense template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExpenseRuleRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseRule"
        "400":
          $ref: "#/components/responses/BadRequest"

  /finance/rules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateExpenseRule
      security:
        - bearerAuth: [ admin ]
      tags: [ Finance ]
      summary: Update a recurring template — takes effect on the next generator pass, already-generated rows stay as they are
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExpenseRuleRequest"
      responses:
        "204":
          description: Updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteExpenseRule
      security:
        - bearerAuth: [ admin ]
      tags: [ Finance ]
      summary: Delete a recurring template; expenses it already generated keep their history
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /finance/income:
    get:
      operationId: listOtherIncome
      security:
        - bearerAuth: [ admin ]
      tags: [ Finance ]
      summary: Money in that never passed through a consultation or a case — refunds, company top-ups, one-offs
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Other income in range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtherIncomeList"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: createOtherIncome
      security:
        - bearerAuth: [ admin ]
      tags: [ Finance ]
      summary: Record income outside the CRM's own consultation/case flow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOtherIncomeRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtherIncome"
        "400":
          $ref: "#/components/responses/BadRequest"

  /finance/income/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteOtherIncome
      security:
        - bearerAuth: [ admin ]
      tags: [ Finance ]
      summary: Delete an other-income entry
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /finance/advocate-rates:
    get:
      operationId: listAdvocateRates
      security:
        - bearerAuth: [ admin ]
      tags: [ Finance ]
      summary: Advocate payout rates — 0 means no automatic payout is generated for that advocate
      responses:
        "200":
          description: Roster with each advocate's commission percent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvocateRateList"

  /finance/advocate-rates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: setAdvocateRate
      security:
        - bearerAuth: [ admin ]
      tags: [ Finance ]
      summary: Set an advocate's share of what they collect; the generated payout is always a draft to confirm, never posted automatically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAdvocateRateRequest"
      responses:
        "204":
          description: Updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"


  /my/cases:
    get:
      operationId: listMyCases
      security:
        - bearerAuth: [ advocate, admin ]
      tags: [ My ]
      summary: The cases assigned to the advocate who is logged in — client contact, fee, what is paid, what is still owed, and the installments behind it
      responses:
        "200":
          description: Own cases, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyCaseList"
        "403":
          $ref: "#/components/responses/Forbidden"

  /my/cases/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: setMyCaseStatus
      security:
        - bearerAuth: [ advocate, admin ]
      tags: [ My ]
      summary: Close an own case or put it back in progress; cancelling writes off what the client owes and stays an admin action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMyCaseStatusRequest"
      responses:
        "204":
          description: Updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /my/clients:
    get:
      operationId: listMyClients
      security:
        - bearerAuth: [ advocate, admin ]
      tags: [ My ]
      summary: Clients the advocate has a case with — a client who only ever had a consultation is not here, consultations carry no advocate
      responses:
        "200":
          description: Own clients, most recent case first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyClientList"
        "403":
          $ref: "#/components/responses/Forbidden"

  /my/clients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getMyClient
      security:
        - bearerAuth: [ advocate, admin ]
      tags: [ My ]
      summary: One own client — name, phone, the advocate's own cases, the client's consultations and the note log; no address, birthdate or tax id, and no firm-wide revenue
      responses:
        "200":
          description: Client card, narrowed to what an advocate may see
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyClientCard"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such client, or none the advocate has a case with — the same answer either way, so an id cannot be probed for existence
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /my/clients/{id}/notes:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: addMyClientNote
      security:
        - bearerAuth: [ advocate, admin ]
      tags: [ My ]
      summary: Log a call or contact on an own client's card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddClientNoteRequest"
      responses:
        "201":
          description: Note added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientNote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /my/settlement:
    get:
      operationId: getMySettlement
      security:
        - bearerAuth: [ advocate, admin ]
      tags: [ My ]
      summary: The advocate's own money — collected, their percentage, accrued, paid out, still owed, month by month; no colleague's row and no firm total
      responses:
        "200":
          description: Own settlement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MySettlement"
        "403":
          $ref: "#/components/responses/Forbidden"

  /my/stats:
    get:
      operationId: getMyStats
      security:
        - bearerAuth: [ advocate, admin ]
      tags: [ My ]
      summary: Own scoreboard — cases by status, average fee, what clients still owe on own cases, collections by month
      responses:
        "200":
          description: Own statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyStats"
        "403":
          $ref: "#/components/responses/Forbidden"

  /client/booking-options:
    get:
      operationId: getClientBookingOptions
      security:
        - bearerAuth: [ client, guest ]
      tags: [ Client ]
      summary: Everything the booking form needs — the hours on offer and the practice areas to choose from
      responses:
        "200":
          description: Free slots earliest first, and the practice-area list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientBookingOptions"
        "403":
          $ref: "#/components/responses/Forbidden"

  /client/requests:
    post:
      operationId: submitClientRequest
      security:
        - bearerAuth: [ client, guest ]
      tags: [ Client ]
      summary: A client's own request — their details plus optionally the hour they picked; creates the client if the CRM has never seen them
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientRequest"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRequestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /client/me:
    get:
      operationId: getClientProfile
      security:
        - bearerAuth: [ client ]
      tags: [ Client ]
      summary: The caller's own record — their contact details, whether reminders can reach them, and their consultations
      responses:
        "200":
          description: Own record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientProfile"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The logged-in role may not use this operation
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict with existing resource
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ClientBookingOptions:
      type: object
      required: [ slots, categories ]
      properties:
        slots:
          type: array
          items:
            type: string
            format: date-time
          x-oapi-codegen-extra-tags:
            json: slots
        # Served rather than hardcoded in the app: the list lives in
        # cases.Categories, and a copy in the client would drift from the one
        # staff pick from.
        categories:
          type: array
          items:
            type: string
          x-oapi-codegen-extra-tags:
            json: categories

    ClientRequest:
      type: object
      required: [ name, phone ]
      properties:
        name:
          type: string
          x-oapi-codegen-extra-tags:
            json: name
        phone:
          type: string
          x-oapi-codegen-extra-tags:
            json: phone
        email:
          type: string
          x-oapi-codegen-extra-tags:
            json: email,omitempty
        category:
          type: string
          x-oapi-codegen-extra-tags:
            json: category,omitempty
        question:
          type: string
          x-oapi-codegen-extra-tags:
            json: question,omitempty
        slot:
          type: string
          format: date-time
          description: The hour picked. Omitted when the client only wants a call back.
          x-oapi-codegen-extra-tags:
            json: slot,omitempty

    ClientRequestResult:
      type: object
      required: [ client_id ]
      properties:
        client_id:
          type: string
          format: uuid
          x-oapi-codegen-extra-tags:
            json: client_id
        consultation:
          $ref: "#/components/schemas/PortalConsultation"

    PortalConsultation:
      type: object
      required: [ id, scheduled_at, status ]
      properties:
        id:
          type: string
          format: uuid
          x-oapi-codegen-extra-tags:
            json: id
        scheduled_at:
          type: string
          format: date-time
          x-oapi-codegen-extra-tags:
            json: scheduled_at
        status:
          type: string
          description: requested until the firm confirms it, then scheduled
          x-oapi-codegen-extra-tags:
            json: status
        price:
          type: number
          format: double
          description: Zero until the firm sets it
          x-oapi-codegen-extra-tags:
            json: price

    ClientProfile:
      type: object
      required: [ name, notifications_on, consultations ]
      properties:
        name:
          type: string
          x-oapi-codegen-extra-tags:
            json: name
        phone:
          type: string
          x-oapi-codegen-extra-tags:
            json: phone,omitempty
        notifications_on:
          type: boolean
          description: True when the chat is bound, which is what reminders are sent to
          x-oapi-codegen-extra-tags:
            json: notifications_on
        consultations:
          type: array
          items:
            $ref: "#/components/schemas/PortalConsultation"
          x-oapi-codegen-extra-tags:
            json: consultations

    GenerateBatchRequest:
      type: object
      required: [ count, site_id ]
      properties:
        count:
          type: integer
          x-oapi-codegen-extra-tags:
            validate: "required,min=1,max=100"
        site_id:
          type: string
          format: uuid
          x-oapi-codegen-extra-tags:
            validate: "required"
        min_words:
          type: integer
        max_words:
          type: integer
        max_tokens:
          type: integer
        language:
          type: string
        provider:
          type: string
        model:
          type: string
        auto_publish:
          type: boolean
        max_cycles:
          type: integer
        ai_threshold:
          type: number
        include_images:
          type: boolean
          nullable: true
    GenerateBatchAccepted:
      type: object
      required: [ count, article_ids ]
      properties:
        count:
          type: integer
        article_ids:
          type: array
          items:
            type: integer
            format: int64
    ArticleList:
      type: object
      required: [ items, total ]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Article"
        total:
          type: integer
          format: int64
    RateArticleRequest:
      type: object
      required: [ rating ]
      properties:
        rating:
          type: string
          enum: [ like, dislike, none ]
    ScrapeEmailsRequest:
      type: object
      required: [ sheet ]
      properties:
        sheet:
          type: string
          example: DONORS
          x-oapi-codegen-extra-tags:
            validate: "required,min=1"

    ScrapeEmailsAccepted:
      type: object
      required: [ sheet, sites_queued, job_id ]
      properties:
        sheet:
          type: string
        sites_queued:
          type: integer
        job_id:
          type: string

    ScrapeJob:
      type: object
      required: [ id, sheet, state, total, processed ]
      properties:
        id:
          type: string
        sheet:
          type: string
        state:
          type: string
        total:
          type: integer
        processed:
          type: integer

    PlaceBacklinksRequest:
      type: object
      required: [ sheet, target_site_url ]
      properties:
        sheet:
          type: string
          example: WEBSITES
          x-oapi-codegen-extra-tags:
            validate: "required,min=1"
        target_site_url:
          type: string
          format: uri
          example: https://playpulse.tech
          description: Public URL of one of the user's wordpress_sites; the backend rejects URLs not present in that table.
          x-oapi-codegen-extra-tags:
            validate: "required,url"
        count:
          type: integer
          example: 3
          description: Stop after this many SUCCESSFUL placements (failures don't count). Defaults to 3 when omitted.
        provider:
          type: string
          example: claude
          description: Override the default LLM provider for this run only. Falls back to LLM_BACKLINK_PROVIDER (or LLM_PROVIDER) when empty.
        model:
          type: string
          description: Override the default LLM model for this run only. Falls back to LLM_BACKLINK_MODEL (or LLM_MODEL) when empty.

    PlaceBacklinksAccepted:
      type: object
      required: [ sheet, sites_queued, run_id ]
      properties:
        sheet:
          type: string
        sites_queued:
          type: integer
        run_id:
          type: string

