      enum: [ marketing, direct, payroll, development, infra, admin ]

    ExpensePaymentMethod:
      type: string
      enum: [ card, invoice, company, cash ]

    ExpenseStatus:
      type: string
      description: >
        A draft is generated but not yet acknowledged and stays out of every P&L number until confirmed.
        A void row is a generated expense staff retired — it keeps its external ref so the generator
        will not re-create it, and it counts as spend nowhere.
      enum: [ draft, posted, void ]

    ExpenseOrigin:
      type: string
      description: derived means computed from CRM data (advocate payouts off case payments), imported means backfilled from the old spreadsheet
      enum: [ manual, recurring, derived, imported ]

    Expense:
      type: object
      required: [ id, spent_at, amount, category_code, category_label, payment_method, vendor, description, status, origin, created_at ]
      properties:
        id:
          type: string
        spent_at:
          type: string
          format: date
        amount:
          type: number
          format: double
        category_code:
          type: string
        category_label:
          type: string
        payment_method:
          $ref: "#/components/schemas/ExpensePaymentMethod"
        vendor:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/ExpenseStatus"
        origin:
          $ref: "#/components/schemas/ExpenseOrigin"
        rule_id:
          type: string
          description: Set when the row came from a recurring template
        created_by:
          type: string
        created_at:
          type: string
          format: date-time

    ExpenseList:
      type: object
      required: [ items, total, sum ]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Expense"
        total:
          type: integer
          format: int64
        sum:
          type: number
          format: double
          description: >
            Sum of POSTED rows in the whole filtered set (not just this page) — drafts and voided rows
            are counted by total but never added into a spend sum

    CreateExpenseRequest:
      type: object
      required: [ spent_at, amount, category_code ]
      properties:
        spent_at:
          type: string
          format: date
        amount:
          type: number
          format: double
        category_code:
          type: string
        payment_method:
          $ref: "#/components/schemas/ExpensePaymentMethod"
        vendor:
          type: string
        description:
          type: string

    UpdateExpenseRequest:
      type: object
      required: [ spent_at, amount, category_code ]
      properties:
        spent_at:
          type: string
          format: date
        amount:
          type: number
          format: double
        category_code:
          type: string
        payment_method:
          $ref: "#/components/schemas/ExpensePaymentMethod"
        vendor:
          type: string
        description:
          type: string

    ExpenseCategory:
      type: object
      required: [ code, label, kind, is_people_pay, is_active, sort_order ]
      properties:
        code:
          type: string
        label:
          type: string
        kind:
          $ref: "#/components/schemas/ExpenseKind"
        is_people_pay:
          type: boolean
          description: Money paid to a person for work. Cuts across kind — copywriting is marketing spend and a person's fee at once
        is_active:
          type: boolean
        sort_order:
          type: integer

    ExpenseCategoryList:
      type: object
      required: [ items ]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExpenseCategory"

    CreateExpenseCategoryRequest:
      type: object
      required: [ code, label, kind ]
      properties:
        is_people_pay:
          type: boolean
        code:
          type: string
          maxLength: 40
          description: Stable machine key, lowercase — never changes, unlike label
        label:
          type: string
          maxLength: 60
        kind:
          $ref: "#/components/schemas/ExpenseKind"
        sort_order:
          type: integer

    UpdateExpenseCategoryRequest:
      type: object
      required: [ label, kind, is_active ]
      properties:
        is_people_pay:
          type: boolean
        label:
          type: string
          maxLength: 60
        kind:
          $ref: "#/components/schemas/ExpenseKind"
        is_active:
          type: boolean
        sort_order:
          type: integer

    ExpenseRule:
      type: object
      required: [ id, name, category_code, category_label, vendor, payment_method, amount, day_of_month, auto_post, active_from, is_active ]
      properties:
        id:
          type: string
        name:
          type: string
        category_code:
          type: string
        category_label:
          type: string
        vendor:
          type: string
        payment_method:
          $ref: "#/components/schemas/ExpensePaymentMethod"
        amount:
          type: number
          format: double
        day_of_month:
          type: integer
        auto_post:
          type: boolean
        active_from:
          type: string
          format: date
        active_to:
          type: string
          format: date
        is_active:
          type: boolean

    CreateExpenseRuleRequest:
      type: object
      required: [ name, category_code, amount, day_of_month ]
      properties:
        name:
          type: string
          maxLength: 120
        category_code:
          type: string
        vendor:
          type: string
        payment_method:
          $ref: "#/components/schemas/ExpensePaymentMethod"
        amount:
          type: number
          format: double
        day_of_month:
          type: integer
          minimum: 1
          maximum: 28
          description: Capped at 28 so a rule never silently skips February
        auto_post:
          type: boolean
          description: true writes straight to the ledger; false generates a draft to confirm
        active_from:
          type: string
          format: date
        active_to:
          type: string
          format: date
        is_active:
          type: boolean

    ExpenseRuleList:
      type: object
      required: [ items ]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExpenseRule"

    UpdateExpenseRuleRequest:
      type: object
      description: >
        Full replacement, not a partial patch — is_active and active_from are required on purpose:
        an omitted is_active would silently re-enable a template that was switched off, and an omitted
        active_from would reset the start date, which decides whether a backfill run generates the rule.
      required: [ name, category_code, amount, day_of_month, auto_post, active_from, is_active ]
      properties:
        name:
          type: string
          maxLength: 120
        category_code:
          type: string
        vendor:
          type: string
        payment_method:
          $ref: "#/components/schemas/ExpensePaymentMethod"
        amount:
          type: number
          format: double
        day_of_month:
          type: integer
          minimum: 1
          maximum: 28
        auto_post:
          type: boolean
        active_from:
          type: string
          format: date
        active_to:
          type: string
          format: date
        is_active:
          type: boolean

    OtherIncome:
      type: object
      required: [ id, received_at, amount, source, description, created_at ]
      properties:
        id:
          type: string
        received_at:
          type: string
          format: date
        amount:
          type: number
          format: double
        source:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time

    OtherIncomeList:
      type: object
      required: [ items, sum ]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OtherIncome"
        sum:
          type: number
          format: double

    CreateOtherIncomeRequest:
      type: object
      required: [ received_at, amount ]
      properties:
        received_at:
          type: string
          format: date
        amount:
          type: number
          format: double
        source:
          type: string
        description:
          type: string

    RunAutoExpensesRequest:
      type: object
      properties:
        month:
          type: string
          pattern: '^\d{4}-\d{2}$'
          description: Month to generate for, "2026-08". Defaults to the current month

    GeneratedExpenses:
      type: object
      required: [ month, recurring, payouts, skipped ]
      properties:
        month:
          type: string
        recurring:
          type: integer
        payouts:
          type: integer
        skipped:
          type: integer
          description: Occurrences already in the ledger — the normal result of a repeat run, not an error

    FinanceMonth:
      type: object
      required: [ month, income_consult, income_cases, income_other, income_total, expense_by_category, expense_by_kind, expense_total, balance, cumulative, marketing_spend, direct_cost, gross_profit, leads, new_clients, cohort_payers, paying_clients, consult_count, case_payment_count, cac, cpl, romi, avg_consult_ticket, avg_case_ticket, margin_percent, marketing_share, revenue_per_client, ltv, ltv_to_cac, lead_to_consult, break_even_consults, income_growth ]
      properties:
        month:
          type: string
          description: '"2026-08", or "total" for the Итого column'
        income_consult:
          type: number
          format: double
        income_cases:
          type: number
          format: double
        income_other:
          type: number
          format: double
        income_total:
          type: number
          format: double
        expense_by_category:
          type: object
          additionalProperties:
            type: number
            format: double
        expense_by_kind:
          type: object
          additionalProperties:
            type: number
            format: double
        expense_total:
          type: number
          format: double
        balance:
          type: number
          format: double
        cumulative:
          type: number
          format: double
          description: Running balance across the whole report — the spreadsheet's "Нар. итог"
        marketing_spend:
          type: number
          format: double
        direct_cost:
          type: number
          format: double
        gross_profit:
          type: number
          format: double
        leads:
          type: integer
        new_clients:
          type: integer
          description: Clients whose first-ever lead landed in this month — the CAC denominator
        consult_count:
          type: integer
          description: Priced, completed consultations behind income_consult — the average-ticket divisor
        case_payment_count:
          type: integer
        cac:
          type: number
          format: double
          description: 0 when the denominator is 0 — an undefined ratio, not a real zero
        cpl:
          type: number
          format: double
        romi:
          type: number
          format: double
        avg_consult_ticket:
          type: number
          format: double
        avg_case_ticket:
          type: number
          format: double
        margin_percent:
          type: number
          format: double
          description: Balance as a share of income — 0.5 is a 50% margin, negative means the month lost money
        marketing_share:
          type: number
          format: double
          description: Marketing spend as a share of all spend
        revenue_per_client:
          type: number
          format: double
          description: Period revenue over the clients who actually paid in it — an average ticket per client, not a lifetime value
        cohort_payers:
          type: integer
          description: Of the clients acquired this month, how many ever paid — the CAC denominator
        paying_clients:
          type: integer
          description: Distinct clients who paid anything in this month
        ltv:
          type: number
          format: double
          description: What a client acquired this month has paid to date, across their whole life, over the cohort members who paid at all
        ltv_to_cac:
          type: number
          format: double
          description: LTV against what acquiring that cohort cost. Deliberately not period-revenue-based, which would make it ROMI+1
        lead_to_consult:
          type: number
          format: double
          description: Share of this month's leads that became a paid consultation — a period ratio, not a cohort conversion
        break_even_consults:
          type: number
          format: double
          description: How many average-ticket consultations the month's spend would have needed to pay for itself
        income_growth:
          type: number
          format: double
          description: Income against the previous month in the report; 0 for the first month

    DataGap:
      type: object
      required: [ kind, count, amount ]
      properties:
        kind:
          type: string
          description: unresolved_consultations | cancelled_priced | no_show_priced | zero_priced_completed | future_consultations | unlinked_cases | duplicate_advocates
        count:
          type: integer
        amount:
          type: number
          format: double
          description: 0 when there is no honest figure — a completed consultation with no price is worth an unknown amount

    DataGapList:
      type: object
      required: [ items ]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DataGap"

    FinancePeriod:
      type: object
      required: [ has_data ]
      properties:
        has_data:
          type: boolean
        first_month:
          type: string
          description: '"2024-06"; absent when has_data is false. Bounds months that carry money'
        last_month:
          type: string
        last_activity_month:
          type: string
          description: Latest month with any activity including leads — selectable, but not what "all time" defaults to

    AdvocateSettlement:
      type: object
      required: [ advocate_id, full_name, commission_percent, collected, accrued, paid, outstanding ]
      properties:
        advocate_id:
          type: string
        full_name:
          type: string
        commission_percent:
          type: number
          format: double
        collected:
          type: number
          format: double
          description: Case payments received in the period on this advocate's cases
        accrued:
          type: number
          format: double
          description: collected × commission_percent
        paid:
          type: number
          format: double
          description: Payouts in the advocates category whose external ref names this advocate
        outstanding:
          type: number
          format: double
          description: accrued − paid; negative means more was paid out than the percentage accrued

    AdvocateSettlementList:
      type: object
      required: [ items, unattributed_paid, consult_income, case_income, total_accrued, total_paid, total_outstanding ]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdvocateSettlement"
        unattributed_paid:
          type: number
          format: double
          description: Advocate payouts that name nobody — the lump sums imported from the spreadsheet; never divided across advocates by guesswork
        consult_income:
          type: number
          format: double
        case_income:
          type: number
          format: double
        total_accrued:
          type: number
          format: double
        total_paid:
          type: number
          format: double
        total_outstanding:
          type: number
          format: double

    FinanceReport:
      type: object
      required: [ months, total, receivable ]
      properties:
        months:
          type: array
          items:
            $ref: "#/components/schemas/FinanceMonth"
        total:
          $ref: "#/components/schemas/FinanceMonth"
        receivable:
          type: number
          format: double
          description: Live sum of what clients still owe across every case (fee minus paid), never scoped to the report window

    AdvocateRate:
      type: object
      required: [ advocate_id, full_name, is_active, commission_percent ]
      properties:
        advocate_id:
          type: string
        full_name:
          type: string
        is_active:
          type: boolean
        commission_percent:
          type: number
          format: double

    AdvocateRateList:
      type: object
      required: [ items ]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdvocateRate"

    SetAdvocateRateRequest:
      type: object
      required: [ commission_percent ]
      properties:
        commission_percent:
          type: number
          format: double
          minimum: 0
          maximum: 100

    MyCase:
      type: object
      required: [ id, client_id, client_name, client_phone, category, status, description, fee, paid, owed, created_at, payments ]
      properties:
        id:
          type: string
        client_id:
          type: string
        client_name:
          type: string
        client_phone:
          type: string
        category:
          type: string
        status:
          type: string
        description:
          type: string
        fee:
          type: number
          format: double
        paid:
          type: number
          format: double
        owed:
          type: number
          format: double
        created_at:
          type: string
          format: date-time
        payments:
          type: array
          items:
            $ref: "#/components/schemas/MyCasePayment"

    MyCasePayment:
      type: object
      required: [ id, amount, paid_at ]
      properties:
        id:
          type: string
        amount:
          type: number
          format: double
        paid_at:
          type: string
          format: date

    MyCaseList:
      type: object
      required: [ items, total_fee, total_paid, total_owed ]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MyCase"
        total_fee:
          type: number
          format: double
        total_paid:
          type: number
          format: double
        total_owed:
          type: number
          format: double

    MyClient:
      type: object
      required: [ id, name, phone, cases, fee, paid, owed, last_case_at ]
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        cases:
          type: integer
        fee:
          type: number
          format: double
        paid:
          type: number
          format: double
        owed:
          type: number
          format: double
        last_case_at:
          type: string
          format: date-time

    MyClientList:
      type: object
      required: [ items ]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MyClient"

    MyClientCard:
      type: object
      required: [ client, cases, consultations, notes ]
      properties:
        client:
          $ref: "#/components/schemas/MyClient"
        cases:
          type: array
          items:
            $ref: "#/components/schemas/MyCase"
        consultations:
          type: array
          items:
            $ref: "#/components/schemas/MyConsultation"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/ClientNote"

    MyConsultation:
      type: object
      required: [ id, scheduled_at, price, status, case_note ]
      properties:
        id:
          type: string
        scheduled_at:
          type: string
          format: date-time
        price:
          type: number
          format: double
        status:
          type: string
        case_note:
          type: string

    MyMonthMoney:
      type: object
      required: [ month, collected, accrued ]
      properties:
        month:
          type: string
          description: YYYY-MM
        collected:
          type: number
          format: double
        accrued:
          type: number
          format: double

    MySettlement:
      type: object
      required: [ advocate_id, full_name, commission_percent, collected, accrued, paid, outstanding, months, paid_is_partial ]
      properties:
        advocate_id:
          type: string
        full_name:
          type: string
        commission_percent:
          type: number
          format: double
        collected:
          type: number
          format: double
        accrued:
          type: number
          format: double
        paid:
          type: number
          format: double
        outstanding:
          type: number
          format: double
        months:
          type: array
          items:
            $ref: "#/components/schemas/MyMonthMoney"
        paid_is_partial:
          type: boolean
          description: Paid counts only payouts booked to this advocate by the generator; lump sums entered by hand name nobody, so outstanding can be overstated

    MyStats:
      type: object
      required: [ cases, clients, by_status, fee_total, paid_total, client_debt, avg_fee, months ]
      properties:
        cases:
          type: integer
        clients:
          type: integer
        by_status:
          type: array
          items:
            $ref: "#/components/schemas/MyStatusCount"
        fee_total:
          type: number
          format: double
        paid_total:
          type: number
          format: double
        client_debt:
          type: number
          format: double
        avg_fee:
          type: number
          format: double
        months:
          type: array
          items:
            $ref: "#/components/schemas/MyMonthMoney"
        first_case_at:
          type: string
          format: date-time
        last_payment_at:
          type: string
          format: date-time

    MyStatusCount:
      type: object
      required: [ status, count ]
      properties:
        status:
          type: string
        count:
          type: integer

    SetMyCaseStatusRequest:
      type: object
      required: [ status ]
      properties:
        status:
          type: string
          enum: [ in_progress, completed ]
