    LeadStats:
      type: object
      required: [ range, totals, trend, by_source, by_creator, by_status, by_category, by_advocate, funnel, by_weekday, audience, by_lead_practice_area ]
      properties:
        range:
          type: object
          required: [ from, to, group_by ]
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
            group_by:
              type: string
        totals:
          type: object
          required: [ leads, clients, consultations, revenue_booked, revenue_earned, revenue_lost, avg_ticket, cases_in_progress, cases_completed, case_fee_contracted, case_paid, case_owed, site_sessions, organic_sessions ]
          properties:
            leads:
              type: integer
              format: int64
            clients:
              type: integer
              format: int64
            consultations:
              type: integer
              format: int64
            revenue_booked:
              type: number
            revenue_earned:
              type: number
            cases_in_progress:
              type: integer
              format: int64
            cases_completed:
              type: integer
              format: int64
            case_fee_contracted:
              type: number
            case_paid:
              type: number
            case_owed:
              type: number
            revenue_lost:
              type: number
            avg_ticket:
              type: number
            site_sessions:
              type: integer
              format: int64
            organic_sessions:
              type: integer
              format: int64
        trend:
          type: array
          items:
            $ref: "#/components/schemas/LeadStatsBucket"
        by_source:
          type: array
          items:
            $ref: "#/components/schemas/LeadStatsSourceValue"
        by_creator:
          type: array
          items:
            $ref: "#/components/schemas/LeadStatsCreatorRevenue"
        by_status:
          type: array
          items:
            $ref: "#/components/schemas/LeadStatsCount"
        by_category:
          type: array
          items:
            $ref: "#/components/schemas/LeadStatsCategoryRevenue"
        by_advocate:
          type: array
          items:
            $ref: "#/components/schemas/LeadStatsCategoryRevenue"
        funnel:
          $ref: "#/components/schemas/LeadStatsFunnel"
        by_weekday:
          type: array
          description: Leads by ISO day-of-week — key "1" (Monday) .. "7" (Sunday)
          items:
            $ref: "#/components/schemas/LeadStatsCount"
        audience:
          $ref: "#/components/schemas/LeadStatsAudience"
        by_lead_practice_area:
          type: array
          description: >-
            Every lead grouped by practice_area, staff-tagged via buttons on
            its own Telegram notification at intake — unlike by_category
            (cases only), this covers leads that never converted. Untagged
            leads group under an empty key.
          items:
            $ref: "#/components/schemas/LeadStatsCount"

    LeadStatsAudience:
      type: object
      description: >-
        Site-visitor demographics/geography from GA4 — userAgeBracket and
        userGender are Google's modeled estimates, not self-reported; city
        is coarse IP geolocation (top 10 by sessions, long tail dropped).
        Describes site traffic in aggregate, not any specific lead or
        client — there's no field on a lead itself for age/gender/city, see
        webleads.Lead. All arrays empty when CF_GA4_PROPERTY_ID isn't
        configured.
      required: [ by_age, by_gender, by_city ]
      properties:
        by_age:
          type: array
          items:
            $ref: "#/components/schemas/LeadStatsCount"
        by_gender:
          type: array
          items:
            $ref: "#/components/schemas/LeadStatsCount"
        by_city:
          type: array
          items:
            $ref: "#/components/schemas/LeadStatsCount"

    LeadStatsFunnel:
      type: object
      description: >-
        Cohort conversion, not a period ratio — cohort_leads is every client
        whose first-ever lead fell in the requested range; consulted_ever/
        cased_ever count them regardless of when the consultation/case
        happened, even long after the range ends.
      required: [ cohort_leads, consulted_ever, cased_ever, avg_days_to_consult, avg_days_consult_to_case, first_consult_outcome ]
      properties:
        cohort_leads:
          type: integer
          format: int64
        consulted_ever:
          type: integer
          format: int64
        cased_ever:
          type: integer
          format: int64
        avg_days_to_consult:
          type: number
          description: Average gap between first lead and first consultation, over clients who got one
        avg_days_consult_to_case:
          type: number
          description: Average gap between first consultation and first case, over clients who got both — not lead-to-case
        first_consult_outcome:
          $ref: "#/components/schemas/LeadStatsFunnelStage"

    LeadStatsFunnelStage:
      type: object
      description: >-
        What happened to each cohort client's FIRST consultation only (not
        "ever", unlike consulted_ever above) — mutually exclusive counts
        that sum to consulted_ever. This is the drop-off detail: of
        everyone who booked, how many actually showed up vs cancelled vs
        no-showed vs are still waiting on a future date.
      required: [ completed, cancelled, no_show, scheduled ]
      properties:
        completed:
          type: integer
          format: int64
          description: Showed up
        cancelled:
          type: integer
          format: int64
        no_show:
          type: integer
          format: int64
        scheduled:
          type: integer
          format: int64
          description: Still in the future, not yet resolved

    LeadStatsBucket:
      type: object
      required: [ bucket, leads, consultations, revenue_earned, site_sessions, organic_sessions ]
      properties:
