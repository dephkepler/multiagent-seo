          type: integer
          format: int64
        cased_ever:
          type: integer
          format: int64
        revenue_earned:
          type: number
        case_paid:
          type: number

    Segment:
      type: string
      description: A client's position in the обращение → консультація → дело funnel — see backend clientsegments.Derive
      enum: [ lead, booked, consulted, client, repeat, lost ]

    ClientSegment:
      type: object
      required: [ client_id, name, phone, segment, overridden, tags, manual_tags, last_activity, case_count, case_fee, case_paid, ltv ]
      properties:
        client_id:
          type: string
        name:
          type: string
        phone:
          type: string
        segment:
          $ref: "#/components/schemas/Segment"
        overridden:
          type: boolean
          description: True when segment was pinned by hand via PATCH /clients/{id}/segment, not calculated
        tags:
          type: array
          items:
            type: string
          description: Auto-computed only (debtor / no_show_risk / high_value / dormant) — see manual_tags for staff-added ones
        manual_tags:
          type: array
          items:
            type: string
          description: Staff-added via POST/DELETE /clients/{id}/tags, picked from GET /clients/tag-defs — never recomputed
        last_activity:
          type: string
          format: date-time
        case_count:
          type: integer
          format: int64
        case_fee:
          type: number
        case_paid:
          type: number
        ltv:
          type: number
          description: >-
            Lifetime value — completed consultations plus case payments
            actually received, all-time. Not case_fee (that's contracted,
            not collected) — kept in sync with ClientDetail.revenue_total.

    ClientList:
      type: object
      required: [ items, total, segment_counts ]
      properties:
        items:
