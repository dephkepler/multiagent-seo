openapi: 3.0.3
info:
  title: ContentFlow API
  description: AI SEO content generation platform.
  version: 0.1.0

servers:
  - url: /
    description: Same origin as the docs (works on any host/port)
  - url: https://multiagent-seo.8cell.tech
    description: Staging

tags:
  - name: Health
    description: Liveness and readiness checks
  - name: Auth
    description: Authentication
  - name: WordPress Sites
    description: WordPress publishing targets
  - name: Articles
    description: SEO article generation and publishing
  - name: Link Building
    description: Donor-website login and backlink placement
  - name: API Tokens
    description: Long-lived per-user API keys
  - name: Clients
    description: Client base with derived funnel segment (обращение → консультація → дело)

paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [ Health ]
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service is degraded (e.g. database unreachable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /auth/login:
    post:
      operationId: login
      tags: [ Auth ]
      summary: Authenticate and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users:
    get:
      operationId: listUsers
      security:
        - bearerAuth: [ ]
      tags: [ Auth ]
      summary: List users
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /api-tokens:
    post:
      operationId: createApiToken
      security:
        - bearerAuth: [ ]
      tags: [ API Tokens ]
      summary: Create an API token (the secret is returned only once)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiTokenRequest"
      responses:
        "201":
          description: Created — save the token now, it can't be retrieved later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      operationId: listApiTokens
      security:
        - bearerAuth: [ ]
      tags: [ API Tokens ]
      summary: List your API tokens (metadata only)
      responses:
        "200":
          description: Your active tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiToken"

  /api-tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteApiToken
      security:
        - bearerAuth: [ ]
      tags: [ API Tokens ]
      summary: Revoke an API token
      responses:
        "204":
          description: Revoked
        "404":
          $ref: "#/components/responses/NotFound"

  /wordpress-sites:
    get:
      operationId: listWordpressSites
      security:
        - bearerAuth: [ ]
      tags: [ WordPress Sites ]
      summary: List WordPress sites
      responses:
        "200":
          description: All non-deleted sites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WordpressSite"
    post:
      operationId: createWordpressSite
      security:
        - bearerAuth: [ ]
      tags: [ WordPress Sites ]
      summary: Add a WordPress site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWordpressSiteRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordpressSite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /wordpress-sites/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getWordpressSite
      security:
        - bearerAuth: [ ]
      tags: [ WordPress Sites ]
      summary: Get a WordPress site
      responses:
        "200":
          description: Site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordpressSite"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateWordpressSite
      security:
        - bearerAuth: [ ]
      tags: [ WordPress Sites ]
      summary: Update a WordPress site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWordpressSiteRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordpressSite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteWordpressSite
      security:
        - bearerAuth: [ ]
      tags: [ WordPress Sites ]
      summary: Soft-delete a WordPress site
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /generate:
    post:
      operationId: generateArticle
      security:
        - bearerAuth: [ ]
      tags: [ Articles ]
      summary: Queue an article for generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequest"
      responses:
        "202":
          description: Generation accepted; poll GET /articles/{id} for status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /generate/batch:
    post:
      operationId: generateBatch
      security:
        - bearerAuth: [ ]
      tags: [ Articles ]
      summary: Queue a batch from the next N unused sheet topics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateBatchRequest"
      responses:
        "202":
          description: Batch queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateBatchAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"

  /articles:
    get:
      operationId: listArticles
      security:
        - bearerAuth: [ ]
      tags: [ Articles ]
      summary: List articles (paginated, newest first)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: A page of articles, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleList"

  /articles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getArticle
      security:
        - bearerAuth: [ ]
      tags: [ Articles ]
      summary: Get an article
      responses:
        "200":
          description: Article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          $ref: "#/components/responses/NotFound"

  /articles/{id}/publish:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: publishArticle
      security:
        - bearerAuth: [ ]
      tags: [ Articles ]
      summary: Publish a draft article
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /articles/{id}/rating:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: rateArticle
      security:
        - bearerAuth: [ ]
      tags: [ Articles ]
      summary: Rate an article (copywriter 👍/👎)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateArticleRequest"
      responses:
        "204":
          description: Rated
        "404":
          $ref: "#/components/responses/NotFound"

  /linkbuilding/place-backlinks:
    post:
      operationId: placeBacklinks
      security:
        - bearerAuth: [ ]
      tags: [ Link Building ]
      summary: Place a backlink to one of our WordPress sites in each suitable donor's latest post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceBacklinksRequest"
      responses:
        "202":
          description: Placement accepted; per-donor status is written to the sheet's I column
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceBacklinksAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"

  /linkbuilding/placements:
    get:
      operationId: listPlacements
      security:
        - bearerAuth: [ ]
      tags: [ Link Building ]
      summary: Per-donor results of a placement run
      parameters:
        - name: run_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Placements for the run, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Placement"

  /linkbuilding/placements/history:
    get:
      operationId: listPlacementHistory
      security:
        - bearerAuth: [ ]
      tags: [ Link Building ]
      summary: Successful placements across all runs (paginated, newest first)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: A page of successful placements, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacementList"

  /linkbuilding/placements/{run_id}/cancel:
    parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: cancelPlacement
      security:
        - bearerAuth: [ ]
      tags: [ Link Building ]
      summary: Request cancellation of a running placement
      responses:
        "202":
          description: Cancellation requested

  /emailscrape:
    post:
      operationId: scrapeEmails
      security:
        - bearerAuth: [ ]
      tags: [ Email Scrape ]
      summary: Crawl the sites listed in a sheet and scrape their email addresses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScrapeEmailsRequest"
      responses:
        "202":
          description: Scrape accepted; found emails and per-site status are written back to the sheet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeEmailsAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"

  /emailscrape/jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getScrapeJob
      security:
        - bearerAuth: [ ]
      tags: [ Email Scrape ]
      summary: Get the progress and state of a scrape job
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeJob"
        "404":
          $ref: "#/components/responses/NotFound"

  /emailscrape/jobs/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: cancelScrapeJob
      security:
        - bearerAuth: [ ]
      tags: [ Email Scrape ]
      summary: Request cancellation of a running scrape job
      responses:
        "202":
          description: Cancellation requested
        "404":
          $ref: "#/components/responses/NotFound"

  /leads/stats:
    get:
      operationId: getLeadStats
      security:
        - bearerAuth: [ ]
      tags: [ Leads ]
      summary: Aggregate lead/consultation stats over a date range, for the admin dashboard
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: group_by
          in: query
          schema:
            type: string
            enum: [ day, month ]
            default: day
      responses:
        "200":
          description: Aggregated stats for the range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadStats"
        "400":
          $ref: "#/components/responses/BadRequest"

  /clients:
    get:
      operationId: listClientSegments
      security:
        - bearerAuth: [ ]
      tags: [ Clients ]
      summary: Every client with their derived funnel segment and tags — no date range, this is a snapshot of all-time activity, not a period aggregate
      responses:
        "200":
          description: Clients with segment and tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientSegment"

  /clients/{id}/segment:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: setClientSegmentOverride
      security:
        - bearerAuth: [ ]
      tags: [ Clients ]
      summary: Pin a client's segment by hand, or pass null to clear the override and fall back to the calculated value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetClientSegmentOverrideRequest"
      responses:
        "204":
          description: Override saved (or cleared)
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /clients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getClientDetail
      security:
        - bearerAuth: [ ]
      tags: [ Clients ]
      summary: One client's full card — leads, consultations, cases, manual notes, money actually collected
      responses:
        "200":
          description: Client card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateClient
      security:
        - bearerAuth: [ ]
      tags: [ Clients ]
      summary: Edit a client's own name/phone from the client card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientRequest"
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /clients/{id}/notes:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: addClientNote
      security:
        - bearerAuth: [ ]
      tags: [ Clients ]
      summary: Add a manual call/contact log entry to a client's card — free text staff types in after a call, there's no phone system integration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddClientNoteRequest"
      responses:
        "201":
          description: Note added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientNote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict with existing resource
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    GenerateBatchRequest:
      type: object
      required: [ count, site_id ]
      properties:
        count:
          type: integer
          x-oapi-codegen-extra-tags:
            validate: "required,min=1,max=100"
        site_id:
          type: string
          format: uuid
          x-oapi-codegen-extra-tags:
            validate: "required"
        min_words:
          type: integer
        max_words:
          type: integer
        max_tokens:
          type: integer
        language:
          type: string
        provider:
          type: string
        model:
          type: string
        auto_publish:
          type: boolean
        max_cycles:
          type: integer
        ai_threshold:
          type: number
        include_images:
          type: boolean
          nullable: true
    GenerateBatchAccepted:
      type: object
      required: [ count, article_ids ]
      properties:
        count:
          type: integer
        article_ids:
          type: array
          items:
            type: integer
            format: int64
    ArticleList:
      type: object
      required: [ items, total ]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Article"
        total:
          type: integer
          format: int64
    RateArticleRequest:
      type: object
      required: [ rating ]
      properties:
        rating:
          type: string
          enum: [ like, dislike, none ]
    ScrapeEmailsRequest:
      type: object
      required: [ sheet ]
      properties:
        sheet:
          type: string
          example: DONORS
          x-oapi-codegen-extra-tags:
            validate: "required,min=1"

    ScrapeEmailsAccepted:
      type: object
      required: [ sheet, sites_queued, job_id ]
      properties:
        sheet:
          type: string
        sites_queued:
          type: integer
        job_id:
          type: string

    ScrapeJob:
      type: object
      required: [ id, sheet, state, total, processed ]
      properties:
        id:
          type: string
        sheet:
          type: string
        state:
          type: string
        total:
          type: integer
        processed:
          type: integer

    PlaceBacklinksRequest:
      type: object
      required: [ sheet, target_site_url ]
      properties:
        sheet:
          type: string
          example: WEBSITES
          x-oapi-codegen-extra-tags:
            validate: "required,min=1"
        target_site_url:
          type: string
          format: uri
          example: https://playpulse.tech
          description: Public URL of one of the user's wordpress_sites; the backend rejects URLs not present in that table.
          x-oapi-codegen-extra-tags:
            validate: "required,url"
        count:
          type: integer
          example: 3
          description: Stop after this many SUCCESSFUL placements (failures don't count). Defaults to 3 when omitted.
        provider:
          type: string
          example: claude
          description: Override the default LLM provider for this run only. Falls back to LLM_BACKLINK_PROVIDER (or LLM_PROVIDER) when empty.
        model:
          type: string
          description: Override the default LLM model for this run only. Falls back to LLM_BACKLINK_MODEL (or LLM_MODEL) when empty.

    PlaceBacklinksAccepted:
      type: object
      required: [ sheet, sites_queued, run_id ]
      properties:
        sheet:
          type: string
        sites_queued:
          type: integer
        run_id:
          type: string

    Placement:
      type: object
      required: [ id, donor_url, target_url, ok, status, created_at ]
      properties:
        id:
          type: integer
          format: int64
        donor_url:
          type: string
        target_url:
          type: string
        ok:
          type: boolean
        outcome:
          type: string
        status:
          type: string
        post_url:
          type: string
        edit_url:
          type: string
        anchor:
          type: string
        created_at:
          type: string
          format: date-time

    PlacementList:
      type: object
      required: [ items, total ]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Placement"
        total:
          type: integer

    GenerateRequest:
      type: object
      required: [ keyword, site_id ]
      properties:
        keyword:
          type: string
          x-oapi-codegen-extra-tags:
            validate: "required,min=1,max=200"
        site_id:
          type: string
          format: uuid
          x-oapi-codegen-extra-tags:
            validate: "required"
        min_words:
          type: integer
        max_words:
          type: integer
        max_tokens:
          type: integer
        language:
          type: string
        site_topic:
          type: string
        extra_rules:
          type: string
        provider:
          type: string
        model:
          type: string
        auto_publish:
          type: boolean
        max_cycles:
          type: integer
        ai_threshold:
          type: number
        include_images:
          type: boolean
          nullable: true
        include_image_attribution:
          type: boolean
          nullable: true

    GenerateAccepted:
      type: object
      required: [ id, keyword, status, created_at ]
      properties:
        id:
          type: integer
          format: int64
        keyword:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        target_keywords:
          type: array
          items:
            type: string
        suggested_title:
          type: string
        site:
          type: string
        site_id:
          type: string
          format: uuid
          nullable: true
        provider:
          type: string
        model:
          type: string
        status_url:
          type: string

    Article:
      type: object
      required: [ id, keyword, status, created_at, updated_at ]
      properties:
        id:
          type: integer
          format: int64
        keyword:
          type: string
        site:
          type: string
        site_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
        wp_post_id:
          type: integer
          format: int64
        wp_edit_url:
          type: string
        wp_post_url:
          type: string
        images_requested:
          type: integer
        images_resolved:
          type: integer
        images_skipped:
          type: integer
        competitor_data:
          type: object
          nullable: true
          x-go-type: json.RawMessage
        check_result:
          type: object
          nullable: true
          x-go-type: json.RawMessage
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
          nullable: true
        request_params:
          type: object
          nullable: true
          x-go-type: json.RawMessage
        human_rating:
          type: boolean
          nullable: true
        ai_score:
          type: number
          nullable: true
        reward:
          type: number
          nullable: true
        quality_ok:
          type: boolean
          nullable: true
        humanize_cycles:
          type: integer
          nullable: true
        tokens:
          type: integer
          nullable: true

    LoginRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          x-oapi-codegen-extra-tags:
            validate: "required,email"
        password:
          type: string
          x-oapi-codegen-extra-tags:
            validate: "required,min=1"

    LoginResponse:
      type: object
      required: [ token, expiresAt ]
      properties:
        token:
          type: string
        expiresAt:
